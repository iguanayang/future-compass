<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>未來人生模擬器（國中精簡版）｜未來羅盤</title>
<style>
  :root { --bg:#070916; --bg2:#15123a; --violet:#a78bfa; --vs:#cdbfff; --gold:#e8c988; --text:#eef0ff; --dim:#a3a9cc; --border:rgba(167,139,250,.32); --soft:rgba(167,139,250,.08); --paper:#efeafc; --ink:#1b1738; --mono:"SFMono-Regular","Menlo",monospace; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { background:radial-gradient(circle at 75% -10%,var(--bg2) 0%,var(--bg) 58%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; min-height:100%; overflow-x:hidden; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  #starfield { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.5; animation:tw 3.6s ease-in-out infinite; }
  @keyframes tw { 0%,100%{opacity:.12} 50%{opacity:.7} }
  .planet { position:fixed; right:-90px; bottom:-90px; width:240px; height:240px; border-radius:50%; pointer-events:none; z-index:0; opacity:.45; background:radial-gradient(circle at 32% 30%,rgba(205,191,255,.55),rgba(109,79,214,.35) 45%,rgba(20,16,60,.2) 75%); }
  #app { position:relative; z-index:1; max-width:clamp(320px,92vw,440px); margin:0 auto; padding:clamp(16px,5vw,22px) clamp(14px,5vw,20px) 44px; min-height:100dvh; }
  @media (min-width:640px){ #app{ max-width:500px; padding-top:36px; } }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .brand .en { font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--gold); display:block; }
  .brand .zh { font-size:15px; font-weight:800; }
  .pill { background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .line { height:1px; background:linear-gradient(90deg,var(--gold),transparent); opacity:.5; margin-bottom:12px; }
  .stage { font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--vs); text-align:center; margin-bottom:8px; }
  .orbit { display:flex; gap:5px; margin:0 0 16px; }
  .orbit i { flex:1; height:5px; border-radius:3px; background:rgba(167,139,250,.2); }
  .orbit i.done { background:rgba(167,139,250,.65); } .orbit i.now { background:var(--vs); box-shadow:0 0 10px var(--violet); }
  .deck { border:1px solid var(--border); border-radius:22px; padding:18px 18px 22px; margin-bottom:16px; background:linear-gradient(170deg,rgba(36,30,86,.75),rgba(14,12,40,.85)); }
  h2 { font-size:22px; font-weight:900; line-height:1.35; margin:0 0 8px; }
  .sub { font-size:13.5px; color:var(--dim); line-height:1.7; margin:0 0 12px; }
  .q { font-size:16px; font-weight:800; line-height:1.5; margin:4px 0 6px; }
  .hint { font-size:12px; color:var(--dim); margin:0 0 10px; }
  .bubs { margin:6px 0 4px; }
  .bub { display:inline-flex; align-items:center; gap:6px; padding:11px 15px; border-radius:999px; border:1.5px solid rgba(167,139,250,.6); background:var(--soft); font-size:14px; margin:0 8px 10px 0; cursor:pointer; line-height:1.3; }
  .bub.on { background:linear-gradient(135deg,rgba(205,191,255,.4),rgba(109,79,214,.32)); border-color:var(--violet); box-shadow:0 0 14px rgba(167,139,250,.35); }
  .bub::before { content:"○"; opacity:.6; font-size:13px; }
  .bub.on::before { content:"✓"; opacity:1; font-weight:800; }
  .bub:active,.dim:active,.row:active { transform:scale(.97); }
  .bub.dis { opacity:.35; pointer-events:none; }
  .txt { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--violet); background:rgba(8,6,28,.7); color:var(--text); font-size:14px; margin:0 0 12px; font-family:inherit; }
  .cta { display:block; width:100%; border:none; border-radius:14px; padding:16px 18px; margin-top:16px; font-size:16px; font-weight:800; cursor:pointer; color:#120d33; background:linear-gradient(135deg,var(--vs),var(--violet) 55%,#8e6ff0); box-shadow:0 6px 22px rgba(139,108,240,.45); }
  .cta:disabled { opacity:.3; box-shadow:none; }
  .ghost { display:block; width:100%; background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:14px; padding:13px 16px; margin-top:10px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .aurora { display:flex; gap:12px; align-items:flex-start; background:rgba(167,139,250,.09); border:1px solid var(--border); border-radius:16px; padding:13px; margin:12px 0; }
  .owl { width:40px; height:40px; flex-shrink:0; }
  .aurora .who { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; font-weight:700; color:var(--gold); display:block; margin-bottom:4px; }
  .aurora p { margin:0 0 8px; font-size:13.5px; line-height:1.75; color:#d3d6f2; } .aurora p:last-child { margin-bottom:0; }
  .box { background:none; border-left:3px solid rgba(167,139,250,.5); border-radius:0; padding:4px 0 4px 12px; font-size:13.5px; line-height:1.8; color:#e6e8ff; margin:8px 0; }
  .port { display:flex; flex-direction:column; align-items:center; margin:2px 0 14px; }
  .porthole { position:relative; width:130px; height:130px; border-radius:50%; border:3px solid rgba(205,191,255,.5); box-shadow:0 0 0 6px rgba(167,139,250,.12), inset 0 0 30px rgba(109,79,214,.5); overflow:hidden; background:radial-gradient(circle at 50% 45%,#2a2468,#0a0824 72%); }
  .porthole .pl { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:radial-gradient(circle at 32% 30%,#dcd2ff,#8e6ff0 55%,#3a2a8c); }
  .porthole .ring { position:absolute; inset:12px; border-radius:50%; border:1px dashed rgba(205,191,255,.5); animation:sp 14s linear infinite; }
  .porthole .ring::after { content:""; position:absolute; top:-4px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }
  .porthole.fast .ring { animation-duration:1.1s; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .read { font-family:var(--mono); font-size:13px; letter-spacing:.1em; color:var(--vs); margin-top:10px; min-height:18px; }
  .dims { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:6px 0 10px; }
  .dim { position:relative; border-radius:14px; padding:12px; border:1.5px solid rgba(167,139,250,.6); background:rgba(255,255,255,.03); cursor:pointer; }
  .dim b { display:block; font-size:14px; margin:3px 0; } .dim small { font-size:11.5px; color:var(--dim); line-height:1.5; }
  .dim.on { border-color:var(--vs); background:rgba(167,139,250,.22); box-shadow:0 0 14px rgba(167,139,250,.35); }
  .dim::after { content:"○"; position:absolute; right:11px; top:8px; opacity:.6; font-size:14px; }
  .dim.on::after { content:"✓"; opacity:1; font-weight:800; }
  .three { display:grid; gap:8px; margin:4px 0 8px; }
  .zl { border:none; border-left:3px solid rgba(167,139,250,.4); border-radius:0; padding:4px 0 4px 11px; font-size:13px; line-height:1.6; background:none; color:#c3c7e6; cursor:default; }
  .note-tag { font-size:11.5px; color:var(--dim); margin:2px 0 4px; }
  .zl b { display:block; font-size:12.5px; margin-bottom:2px; color:var(--vs); }
  .row { display:flex; align-items:flex-start; gap:10px; padding:12px; border-radius:12px; border:1.5px solid rgba(167,139,250,.55); margin-bottom:9px; cursor:pointer; font-size:13.5px; line-height:1.55; background:rgba(255,255,255,.03); }
  .row .bx { width:18px; height:18px; border:1.5px solid var(--violet); border-radius:50%; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:10px; }
  .row.on { background:rgba(167,139,250,.2); border-color:var(--violet); } .row.on .bx { background:var(--violet); color:#120d33; }
  .card { position:relative; background:var(--paper); color:var(--ink); border-radius:8px; padding:0 0 16px; margin:4px 0 16px; box-shadow:0 18px 40px rgba(0,0,0,.45); overflow:hidden; }
  .mail { height:10px; background:repeating-linear-gradient(135deg,#e0566b 0 12px,#fff 12px 20px,#4b6fd8 20px 32px,#fff 32px 40px); }
  .ch { padding:16px 18px 4px; } .ch .from { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; opacity:.6; } .ch h3 { margin:4px 0 0; font-size:19px; font-weight:900; line-height:1.35; }
  .cs { padding:12px 18px 0; } .cs + .cs { border-top:1px dashed rgba(27,23,56,.28); margin-top:12px; }
  .cs h4 { margin:0 0 5px; font-size:12px; color:#5a41b8; font-weight:800; } .cs p { margin:0; font-size:13px; line-height:1.75; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; } .tg { font-size:12px; padding:4px 10px; border-radius:999px; background:rgba(109,79,214,.12); border:1px solid rgba(109,79,214,.45); }
  .adj { border:1px dashed var(--border); border-radius:16px; padding:13px; margin:12px 0; }
  .adj h5 { margin:0 0 4px; font-size:14px; } .adj .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; } .adj .ghost { margin:0; padding:11px 6px; font-size:12.5px; }
  .modal { position:fixed; inset:0; background:rgba(3,3,12,.82); display:flex; align-items:center; justify-content:center; z-index:300; padding:24px; }
  .mbox { background:#17133f; border:1px solid var(--violet); border-radius:18px; padding:20px; max-width:320px; width:100%; text-align:center; } .mbox h4 { margin:0 0 8px; font-size:16px; } .mbox p { margin:0 0 10px; font-size:13px; color:var(--dim); line-height:1.7; }
  .share { position:fixed; inset:0; background:rgba(3,3,12,.93); display:none; align-items:center; justify-content:center; z-index:200; padding:24px; flex-direction:column; } .share.show { display:flex; }
  .share img { max-width:320px; width:auto; max-height:76vh; object-fit:contain; border-radius:10px; } .share p { color:var(--dim); font-size:12.5px; margin:14px 0; } .share button { background:rgba(167,139,250,.12); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:9px 26px; font-size:13px; cursor:pointer; }

  /* 階段切換動畫 */
  #app { transform-origin: 50% 35%; }
  #app[class*="out-"], #app[class*="in-"] { pointer-events: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 250; opacity: 0; transition: opacity .25s; mix-blend-mode: screen; }
  #fxl { position: fixed; left: 0; right: 0; bottom: 16vh; text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--vs); z-index: 251; opacity: 0; pointer-events: none; text-shadow: 0 0 12px var(--violet); }
  #fxl.show { animation: lbl .95s ease both; }
  @keyframes lbl { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .95; } 100% { opacity: 0; } }
  #app.out-warp { animation: oWarp .34s cubic-bezier(.5,0,1,.6) forwards; }
  @keyframes oWarp { to { transform: scale(1.18); opacity: 0; filter: blur(4px) brightness(1.6); } }
  #app.in-warp { animation: iWarp .42s cubic-bezier(.1,.7,.2,1) both; }
  @keyframes iWarp { from { transform: scale(.88); opacity: 0; filter: blur(4px) brightness(1.6); } to { transform: none; opacity: 1; filter: none; } }
  #app.out-zin { animation: oZin .34s ease-in forwards; }
  @keyframes oZin { to { transform: scale(1.4); opacity: 0; filter: blur(3px); } }
  #app.in-zin { animation: iZin .42s cubic-bezier(.15,.8,.25,1) both; }
  @keyframes iZin { from { transform: scale(.72); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
  #app.out-zout { animation: oZout .34s ease-in forwards; }
  @keyframes oZout { to { transform: scale(.66); opacity: 0; filter: blur(2px); } }
  #app.in-zout { animation: iZout .42s cubic-bezier(.15,.8,.25,1) both; }
  @keyframes iZout { from { transform: scale(1.4); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
  #app.out-spin { animation: oSpin .34s ease-in forwards; }
  @keyframes oSpin { to { transform: rotate(-16deg) scale(.8); opacity: 0; filter: blur(3px); } }
  #app.in-spin { animation: iSpin .45s cubic-bezier(.15,.8,.25,1) both; }
  @keyframes iSpin { from { transform: rotate(16deg) scale(.8); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
  @media (prefers-reduced-motion:reduce){ #app,#fx,#fxl{ animation:none!important; }  .star,.porthole .ring{ animation:none!important; } }

  .report { border: 1px solid rgba(167,139,250,.5); background: rgba(167,139,250,.08); border-radius: 16px; padding: 16px; margin: 16px 0 6px; }
  .report .rp-title { font-weight: 800; font-size: 15px; margin-bottom: 10px; }
  .report .rp-step { font-size: 14px; line-height: 1.7; margin: 6px 0; }
  .report .rp-step small { display: block; font-size: 11.5px; opacity: .7; margin-left: 1.6em; }
  .report .rp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .report .rp-chips span { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); }
  a.rp-line { display: block; text-align: center; text-decoration: none; margin-top: 12px; padding: 16px 18px; border-radius: 14px; }
</style>
</head>
<body>
<div id="starfield"></div><div class="planet"></div><canvas id="fx"></canvas><div id="fxl"></div>
<div id="app"></div>

var GAPS = [

var RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var busy = false, fxRaf = null;
var FX_LABEL = { warp:"WARP ▸ 加速", zin:"ZOOM IN ▸ 拉近", zout:"ZOOM OUT ▸ 拉遠", spin:"ROTATE ▸ 旋轉" };
var TR = { "intro>s1a":"warp", "s1b>s2":"warp", "s2>s3":"zin", "s3>s4a":"warp", "s4b>s5":"zout" };

function warp(ms, mode, strength) {
  var c = document.getElementById("fx"); if (!c || !c.getContext) return;
  var ctx = c.getContext("2d"); if (!ctx) return;
  var W = c.width = window.innerWidth, H = c.height = window.innerHeight, cx = W / 2, cy = H * 0.42, maxR = Math.sqrt(W*W + H*H) / 2;
  var stars = [], i;
  for (i = 0; i < 80; i++) stars.push({ a: Math.random() * 6.283, r: Math.random() * maxR * 0.9, s: 0.4 + Math.random() * 1.2, col: Math.random() < .25 ? "#e8c988" : (Math.random() < .5 ? "#cdbfff" : "#e9e6ff") });
  var t0 = performance.now();
  if (fxRaf) cancelAnimationFrame(fxRaf);
  c.style.opacity = 1;
  function frame(now) {
    var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
    ctx.clearRect(0, 0, W, H);
    var speed = 6 + e * 60;
    stars.forEach(function(st) {
      var len = (4 + e * 70) * st.s, r0, r1;
      if (mode === "in") { st.r -= speed * st.s * .9; if (st.r < 8) st.r = maxR * (.6 + Math.random() * .4); r0 = st.r; r1 = st.r + len; }
      else if (mode === "spin") { st.a += (.01 + e * .12) * st.s; r0 = r1 = st.r; }
      else { st.r += speed * st.s * .9; if (st.r > maxR) st.r = Math.random() * 40; r0 = Math.max(0, st.r - len); r1 = st.r; }
      ctx.strokeStyle = st.col; ctx.globalAlpha = strength * (.22 + .5 * e); ctx.lineWidth = .45 + st.s * .35;
      ctx.beginPath();
      if (mode === "spin") ctx.arc(cx, cy, st.r, st.a - .25 * st.s - e * .6, st.a);
      else { ctx.moveTo(cx + Math.cos(st.a) * r0, cy + Math.sin(st.a) * r0); ctx.lineTo(cx + Math.cos(st.a) * r1, cy + Math.sin(st.a) * r1); }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    if (p < 1) fxRaf = requestAnimationFrame(frame); else { c.style.opacity = 0; ctx.clearRect(0, 0, W, H); }
  }
  fxRaf = requestAnimationFrame(frame);
}

}

    '<div class="report"><div class="rp-title">✨ 探索完成！</div>' +
      '<div class="rp-step">📸 ① 截圖你的「人生藍圖」<small>請確認截圖包含整張卡片，或按下面「下載」取得完整圖片</small></div>' +
      '<div class="rp-step">💬 ② 回到 LINE 聊天室傳送圖片</div>' +
      '<div class="rp-step">🚀 ③ 再輸入【未來回報】</div>' +
      '<div class="rp-chips"><span>⭐ 任務積分 +10</span><span>🌌 探索進度 +2%</span><span>🏅 獲得未來徽章</span></div></div>' +
      '<a class="cta rp-line" href="' + LINE_URL + '">回到 LINE</a>' +
    '<div class="adj"><h5>🔄 想調整嗎？</h5><p class="sub" style="margin:0;font-size:12.5px;">重新調整不代表原本的想法錯了，你的選擇都會保留。</p><div class="grid">'+
      '<button class="ghost" data-act="go" data-v="s1a">換生活元素</button><button class="ghost" data-act="go" data-v="s1b">換最不想失去的</button>'+
      '<button class="ghost" data-act="go" data-v="s3">換最重要的事</button><button class="ghost" data-act="ff0">⏩ 再快轉一次</button></div></div>'+
    '<button class="cta" data-act="download">📥 下載我的人生藍圖</button>'+
    '<button class="ghost" data-act="askRestart">♻️ 重新開始</button>';
}

function bindAll(){
  document.querySelectorAll("[data-act]").forEach(function(el){ el.addEventListener("click",function(){ act(el.getAttribute("data-act"),el.getAttribute("data-v")); }); });
  var l=document.getElementById("letter");
  if(l) l.addEventListener("input",function(){ S.letter=l.value; var p=document.getElementById("lp"); if(p) p.textContent=l.value.trim()?l.value:"（可以在下面寫一句話）"; });
}
function act(a,v){
  if(busy||S.anim) return;
  var keep=true;
  if(a==="go"){ nav(v,false); return; }
  else if(a==="back"){ var i=ORDER.indexOf(S.screen); if(i>0) nav(ORDER[i-1],true); return; }
  else if(a==="tEl") tog(S.els,v,3);
  else if(a==="tKeep") tog(S.keeps,v,2);
  else if(a==="ff"){ fastForward(); return; }
  else if(a==="ff0"){ S.phase=0; nav("s2",false); return; }
  else if(a==="status") S.status=v;
  else if(a==="tCare") tog(S.cares,v,2);
  else if(a==="dcare") tog(S.dcare,v,2);
  else if(a==="dhelp") tog(S.dhelp,v,1);
  else if(a==="tGap"){ if(v==="none"){ S.gaps=has(S.gaps,"none")?[]:["none"]; } else { var n=S.gaps.indexOf("none"); if(n!==-1)S.gaps.splice(n,1); tog(S.gaps,v,2); } }
  else if(a==="task") S.task=(S.task===v)?null:v;
  else if(a==="download"){ share(); return; }
  else if(a==="askRestart") S.confirm=true;
  else if(a==="cancelRestart") S.confirm=false;
  else if(a==="doRestart"){ S=fresh(); S.confirm=false; swap("warp",function(){ render(false); }); return; }
  render(keep);
}
function fastForward(){
  if(S.anim||busy) return; S.anim=true; var target=S.phase===0?90:365; render(true);
  if(!RM){ warp(1250,"out",.45); showLabel("warp"); }
  var t=0, steps=22, id=setInterval(function(){ t++; var r=document.getElementById("rd"); if(r) r.textContent="⏩ T + "+Math.round(target*t/steps)+" 天";
    if(t>=steps){ clearInterval(id); swap("spin",function(){ S.anim=false; S.phase++; render(false); }); } },55);
}

function wrap(ctx,text,w){ var L=[],ln=""; text.split("").forEach(function(c){ var t=ln+c; if(ctx.measureText(t).width>w&&ln!==""){L.push(ln);ln=c;}else ln=t; }); if(ln)L.push(ln); return L; }
function share(){
  var care = careNames().filter(Boolean);
  var support = S.dcare.map(function(i){ return dimOf(i).name; });
  if (care.length) support.push("一年後要照顧：" + care.join("、"));
  S.dhelp.forEach(function(i){ support.push("需要幫忙：" + dimOf(i).name); });
  // 空白的項目直接省略，避免「尚未選擇」「留白」這類填充文字被 AI 當成學生寫的內容
  var raw = [
    {h:"1️⃣ 我想過的生活",t:lifeDesc()},
    {h:"2️⃣ 我最不想失去的",t:keeps().map(function(k){return k.label;}).join("、")},
    {h:"3️⃣ 最重要的，和需要的支持",t:support.join("、")},
    {h:"4️⃣ 我發現還缺的",t:gapObjs().map(function(g){return g.label;}).join("、")},
    {h:"5️⃣ 我這星期想試的小任務",t:taskText()},
    {h:"6️⃣ 給未來自己的話",t:S.letter.trim()},
    {h:"🦉 AURORA 的話（系統自動產生，供參考）",t:feedback().join("")}
  ];
  var blocks = raw.filter(function(b){ return b.t && b.t.trim() !== ""; });
  drawShare({ title:"未來人生模擬結果", subtitle:"我的理想人生藍圖｜我想活出的生活", code:"FC-LIFE / BLUEPRINT", blocks:blocks,
    bg0:"#1b1750", bg1:"#070916", accent:"#cdbfff", footer:"這是思考用的情境，不是對未來的預測", imgId:"shareImg", boxId:"shareBox", showCls:"show" });
}

// 下載圖片：先量測內容再決定高度；標題固定、文字放大、對比提高，方便手機截圖與 AI 辨識
function drawShare(o) {
  var W = 720, P = 64, F = "'PingFang TC','Microsoft JhengHei',sans-serif", BODY = 17, LH = 28;
  var m = document.createElement("canvas").getContext("2d"); m.font = BODY + "px " + F;
  function wrapLines(text, maxW) {
    var out = [], line = "";
    text.split("").forEach(function(ch) { var t = line + ch; if (m.measureText(t).width > maxW && line !== "") { out.push(line); line = ch; } else line = t; });
    if (line) out.push(line); return out;
  }
  o.blocks.forEach(function(b) { b.lines = []; b.t.split("\n").forEach(function(par) { wrapLines(par, W - P * 2 - (b.indent || 0)).forEach(function(l) { b.lines.push(l); }); }); });
  var H = 250; o.blocks.forEach(function(b) { H += 46 + b.lines.length * LH + 24; }); H = Math.max(H + 100, 820);
  var c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
  var g = x.createRadialGradient(W * .7, 0, 0, W / 2, H * .4, H); g.addColorStop(0, o.bg0); g.addColorStop(1, o.bg1); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(255,255,255,0.35)"; for (var i = 0; i < 60; i++) { x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 1.4 + .3, 0, 7); x.fill(); }
  if (o.deco) o.deco(x, W, H);
  x.strokeStyle = o.accent; x.globalAlpha = .55; x.lineWidth = 2; x.strokeRect(26, 30, W - 52, H - 60); x.globalAlpha = 1;
  x.textAlign = "center";
  x.font = "bold 28px " + F; x.fillStyle = "#ffffff"; x.fillText("未來羅盤｜" + o.title, W / 2, 96);
  x.font = "15px " + F; x.fillStyle = o.accent; x.fillText(o.subtitle, W / 2, 128);
  x.font = "13px monospace"; x.fillStyle = "#c9cde6"; x.fillText(o.code, W / 2, 156);
  x.textAlign = "left";
  var y = 210;
  o.blocks.forEach(function(b) {
    x.strokeStyle = "rgba(255,255,255,0.18)"; x.lineWidth = 1; x.setLineDash([4, 5]); x.beginPath(); x.moveTo(P, y - 22); x.lineTo(W - P, y - 22); x.stroke(); x.setLineDash([]);
    x.font = "bold 20px " + F; x.fillStyle = o.accent; x.fillText(b.h, P, y + 6);
    y += 46;
    x.font = BODY + "px " + F; x.fillStyle = "#eceef8";
    b.lines.forEach(function(l) { x.fillText(l, P + (b.indent || 0), y); y += LH; });
    y += 24;
  });
  x.textAlign = "center"; x.font = "14px " + F; x.fillStyle = "#c9cde6"; x.fillText(o.footer, W / 2, H - 56);
  document.getElementById(o.imgId).src = c.toDataURL("image/png");
  document.getElementById(o.boxId).classList.add(o.showCls);
}

(function(){ var h=""; for(var i=0;i<42;i++) h+='<div class="star" style="width:'+(Math.random()*2+1).toFixed(1)+'px;height:'+(Math.random()*2+1).toFixed(1)+'px;top:'+(Math.random()*100).toFixed(1)+'%;left:'+(Math.random()*100).toFixed(1)+'%;animation-delay:'+(Math.random()*3.6).toFixed(1)+'s;"></div>'; document.getElementById("starfield").innerHTML=h; })();
render(false);
</script>
