  .brand .en { font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--gl); display:block; }
  .brand .zh { font-size:15px; font-weight:800; }
  .pill { background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .line { height:1px; background:linear-gradient(90deg,var(--gold),transparent); opacity:.55; margin-bottom:12px; }
  .stage { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--gl); margin-bottom:8px; }
  .habs { display:flex; gap:6px; letter-spacing:0; } .hab { font-size:11px; color:#8f7f60; border:1px solid rgba(224,160,48,.25); border-radius:999px; padding:2px 8px; white-space:nowrap; } .hab.on { color:var(--gl); border-color:var(--gold); background:rgba(224,160,48,.15); }
  .habrow { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:8px 0 4px; } .habc { text-align:center; width:30%; min-width:92px; } .habc .c { font-size:30px; filter:grayscale(1) opacity(.4); } .habc.on .c { filter:none; } .habc b { display:block; font-size:12.5px; margin-top:2px; } .habc small { display:block; font-size:11px; color:var(--dim); line-height:1.5; margin-top:2px; }
  .track { display:flex; gap:5px; margin:0 0 16px; }
  .track i { flex:1; height:5px; border-radius:3px; background:rgba(224,160,48,.18); }
  .track i.done { background:rgba(224,160,48,.7); } .track i.now { background:var(--gl); box-shadow:0 0 10px var(--gold); }

  .deck { position:relative; border:1px solid var(--line); border-radius:20px; padding:18px 18px 22px; margin-bottom:16px; background:linear-gradient(170deg,rgba(60,38,12,.78),rgba(22,15,7,.9)); }
  .deck::before,.deck::after { content:""; position:absolute; width:22px; height:22px; border:2px solid var(--gold); opacity:.7; }
  .deck::before { left:-1px; top:-1px; border-right:none; border-bottom:none; border-radius:20px 0 0 0; }
  .deck::after { right:-1px; bottom:-1px; border-left:none; border-top:none; border-radius:0 0 20px 0; }
  h2 { font-size:22px; font-weight:900; line-height:1.35; margin:0 0 8px; }
  .sub { font-size:13.5px; color:var(--dim); line-height:1.75; margin:0 0 12px; }
  .q { font-size:15.5px; font-weight:800; line-height:1.5; margin:12px 0 6px; }
  .hint { font-size:12px; color:var(--dim); margin:0 0 10px; line-height:1.6; }
  .warn { font-size:12px; color:var(--gl); background:rgba(224,160,48,.1); border:1px dashed rgba(224,160,48,.5); border-radius:12px; padding:10px 12px; line-height:1.65; margin:10px 0; }

  .bubs { margin:6px 0 4px; }
  .bub { display:inline-flex; align-items:center; gap:6px; padding:11px 15px; border-radius:999px; border:1.5px solid rgba(224,160,48,.55); background:var(--soft); font-size:14px; margin:0 8px 10px 0; cursor:pointer; line-height:1.3; }
  .bub::before { content:"○"; opacity:.6; font-size:13px; }
  .bub.on { background:linear-gradient(135deg,rgba(244,206,129,.35),rgba(184,116,44,.3)); border-color:var(--gl); box-shadow:0 0 14px rgba(224,160,48,.35); }
  .bub.on::before { content:"✓"; opacity:1; font-weight:800; }
  .txt { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--gold); background:rgba(14,9,3,.75); color:var(--text); font-size:14px; margin:0 0 10px; font-family:inherit; }
  .txt::placeholder { color:#7d6c4c; }
  textarea.txt { resize:vertical; min-height:70px; line-height:1.6; }

  .cta { display:block; width:100%; text-align:center; text-decoration:none; border:none; border-radius:999px; padding:16px 18px; margin-top:16px; font-size:16px; font-weight:800; cursor:pointer; color:#2a1604; background:linear-gradient(180deg,var(--gl),var(--gold) 55%,var(--cu)); box-shadow:0 5px 0 var(--br),0 10px 22px rgba(224,160,48,.3); transition:transform .08s,box-shadow .08s; }
  .cta:active { transform:translateY(3px); box-shadow:0 2px 0 var(--br); }
  .cta:disabled { opacity:.35; box-shadow:none; }
  .ghost { display:block; width:100%; text-align:center; text-decoration:none; background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:13px 16px; margin-top:10px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .copy { display:inline-block; width:auto; margin:6px 0 0; padding:9px 16px; font-size:13px; background:transparent; border:1.5px solid var(--gold); color:var(--gl); border-radius:999px; cursor:pointer; font-weight:700; }

  .aurora { display:flex; gap:12px; align-items:flex-start; background:rgba(224,160,48,.09); border:1px solid var(--line); border-radius:16px; padding:13px; margin:12px 0; }
  .owl { width:40px; height:40px; flex-shrink:0; }
  .aurora .who { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; font-weight:700; color:var(--gl); display:block; margin-bottom:4px; }
  .aurora p { margin:0 0 8px; font-size:13.5px; line-height:1.75; color:#e8dcc2; } .aurora p:last-child { margin-bottom:0; }

  .lv { display:grid; gap:10px; margin:10px 0; }
  .lvb { text-align:left; border:1.5px solid rgba(224,160,48,.55); background:var(--soft); border-radius:16px; padding:14px; cursor:pointer; color:var(--text); font-family:inherit; }
  .lvb b { font-size:16px; display:block; margin-bottom:3px; } .lvb small { font-size:12.5px; color:var(--dim); line-height:1.6; }
  .lvb:active { transform:scale(.98); }

  .scene { perspective:900px; margin:8px 0 12px; }
  .card3d { position:relative; height:330px; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.2,.8,.2,1); }
  .card3d.flipped { transform:rotateY(180deg); }

  @keyframes bob { 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-8px) rotate(3deg);} }
  .front { transform:rotateY(180deg); background:linear-gradient(170deg,#4a3012,#1c1208); overflow:auto; }
  .front .kind { align-self:flex-start; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; background:var(--gold); color:#2a1604; padding:3px 10px; border-radius:999px; font-weight:800; }
  .front h3 { margin:10px 0 10px; font-size:22px; }
  .front ul { margin:0; padding:0; list-style:none; } .front li { font-size:14px; line-height:1.7; padding:7px 0; border-top:1px dashed rgba(224,160,48,.3); } .front li:first-child { border-top:none; }
  .front li::before { content:"▸ "; }

  .ai { border:1px solid var(--line); border-radius:16px; padding:6px 12px; background:rgba(0,0,0,.25); margin:8px 0; }
  .ai .t { font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--gl); padding:8px 0 2px; }
  .sent { display:flex; gap:10px; align-items:flex-start; padding:11px 8px; border-top:1px dashed rgba(224,160,48,.25); cursor:pointer; font-size:14px; line-height:1.65; border-radius:8px; }
  .sent .n { font-family:var(--mono); color:var(--gl); font-size:12px; margin-top:2px; flex-shrink:0; }
  .sent .mk { margin-left:auto; flex-shrink:0; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--dim); white-space:nowrap; }
  .sent.on { background:rgba(255,138,122,.14); } .sent.on .mk { border-color:var(--bad); color:var(--bad); }
  .sent.on .mk::before { content:"🚩 "; }
  .sent.ok .mk { border-color:var(--ok); color:var(--ok); } .sent.bad .mk { border-color:var(--bad); color:var(--bad); }
  .sent .why { display:block; font-size:12.5px; color:#f0d9b0; margin-top:6px; line-height:1.6; }
  .sent .body { flex:1; }

  .prompt { white-space:pre-wrap; background:rgba(0,0,0,.4); border:1px solid var(--gold); border-radius:14px; padding:13px; font-size:13px; line-height:1.75; user-select:text; -webkit-user-select:text; margin:10px 0 4px; color:#fbf0d6; }
  .fu { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:rgba(255,255,255,.03); font-size:13.5px; line-height:1.6; }
  .fu .copy { display:block; margin-top:6px; }

  .qrow { margin:10px 0; } .qrow label { display:block; font-size:14px; font-weight:700; margin-bottom:6px; line-height:1.5; }
  .qrow .inp { display:flex; gap:8px; align-items:center; } .qrow .inp .txt { margin:0; } .unit { font-size:13px; color:var(--dim); white-space:nowrap; }
  .res { font-size:13px; line-height:1.65; margin-top:6px; padding:8px 10px; border-radius:10px; }
  .res.ok { background:rgba(143,214,148,.12); color:var(--ok); } .res.bad { background:rgba(255,138,122,.12); color:#ffc0b6; }
  .ck { display:flex; align-items:flex-start; gap:10px; padding:12px; border:1.5px solid rgba(224,160,48,.5); border-radius:12px; margin-bottom:8px; cursor:pointer; font-size:14px; line-height:1.55; background:rgba(255,255,255,.03); }
  .ck .bx { width:19px; height:19px; border:1.5px solid var(--gold); border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px; }
  .ck.on { background:rgba(224,160,48,.18); border-color:var(--gl); } .ck.on .bx { background:var(--gold); color:#2a1604; }
  .demo { background:rgba(143,214,148,.08); border:1px solid rgba(143,214,148,.4); border-radius:14px; padding:10px 14px; margin:10px 0; }

  .got { text-align:center; margin-bottom:10px; } .got b { font-size:18px; } .got small { display:block; color:var(--dim); margin-top:4px; }
  .receipt { background:#f6ecd9; color:#2a1c09; border-radius:6px; padding:18px 18px 16px; margin:12px 0 16px; font-family:var(--mono); box-shadow:0 14px 30px rgba(0,0,0,.45); position:relative; }
  .receipt::after { content:""; position:absolute; left:0; right:0; bottom:-8px; height:8px; background:radial-gradient(circle at 6px 0,#f6ecd9 5px,transparent 6px) 0 0/12px 8px repeat-x; }

  .report .rp-step small { display:block; font-size:11.5px; opacity:.7; margin-left:1.6em; }
  .rp-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; } .rp-chips span { font-size:11.5px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.1); }

  .modal { position:fixed; inset:0; background:rgba(8,5,2,.85); display:flex; align-items:center; justify-content:center; z-index:300; padding:24px; }
  .mbox { background:#241808; border:1px solid var(--gold); border-radius:18px; padding:20px; max-width:320px; width:100%; text-align:center; } .mbox h4 { margin:0 0 8px; font-size:16px; } .mbox p { margin:0 0 10px; font-size:13px; color:var(--dim); line-height:1.7; }

function tog(a,v,max){ var i=a.indexOf(v); if(i!==-1){a.splice(i,1);return;} if(max&&a.length>=max)return; a.push(v); }
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function V(){ return getV(S.vid); }

var OWL='<svg class="owl" viewBox="0 0 60 60"><path d="M10 18 Q17 5 25 15" stroke="#f4ce81" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M50 18 Q43 5 35 15" stroke="#f4ce81" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="30" cy="32" r="23" fill="#3a2610"/><ellipse cx="20" cy="29" rx="7.5" ry="8.5" fill="#f6ecd9"/><ellipse cx="40" cy="29" rx="7.5" ry="8.5" fill="#f6ecd9"/><circle cx="20" cy="30" r="3.3" fill="#e0a030"/><circle cx="40" cy="30" r="3.3" fill="#e0a030"/><path d="M30 35 L25.5 42 L34.5 42 Z" fill="#f4ce81"/></svg>';
function aurora(h){ return '<div class="aurora">'+OWL+'<div><span class="who">AURORA</span>'+h+'</div></div>'; }
function bub(act,v,on,l,cls){ return '<span class="bub'+(on?" on":"")+(cls?" "+cls:"")+'" data-act="'+act+'" data-v="'+v+'">'+l+'</span>'; }
function go(to,label,ghost,dis){ return '<button class="'+(ghost?"ghost":"cta")+'" data-act="go" data-v="'+to+'"'+(dis?" disabled":"")+'>'+label+'</button>'; }

/* ================= 計算 ================= */
function wrongIdx(v){ var r=[]; v.sentences.forEach(function(s,i){ if(s.wrong) r.push(i); }); return r; }
function foundCount(){ var v=V(); if(!v) return 0; return S.picks.filter(function(i){ return v.sentences[i].wrong; }).length; }
function followCount(){ return S.follows.length + (S.followOther.trim()?1:0); }
function checkResults(){
  var v=V(); return v.checks.map(function(c,i){ var raw=String(S.chk[i]||"").replace(/,/g,"").trim(); var val=parseFloat(raw); var okv = raw!=="" && !isNaN(val) && Math.abs(val-c.ans)<=c.tol; return { val:raw, ok:okv, ans:c.ans, q:c.q, unit:c.unit }; });
}
// 三個使用 AI 的「好習慣」紀錄（不是獎勵，獎勵是完成任務後的金錢探索徽章）
function habits(){
  var r=[];
  r.push({id:"find",icon:"🔍",name:"找碴",desc:"檢查過 AI 的答案，找出它的破綻",ok:S.revealed&&foundCount()>=1});
  if(!S.noAI) r.push({id:"ask",icon:"💬",name:"追問",desc:"不只問一次，還會追問 AI",ok:followCount()>=2});
  r.push({id:"check",icon:"🧮",name:"查核",desc:"自己重算，不直接相信數字",ok:S.chkDone&&checkResults().filter(function(x){return x.ok;}).length>=2});
  return r;
}
function habitsBar(){ return habits().map(function(h){ return '<span class="hab'+(h.ok?" on":"")+'">'+(h.ok?"✓ ":"○ ")+h.name+'</span>'; }).join(""); }
function buildPrompt(){
  var v=V();
  return ["我是國高中生，想練習用 AI 做財務判斷，請你當我的理財小幫手。","【情境】"+v.story.join("；")+"。","【我想知道】"+GOALS[S.goal], S.cons.length?"【請注意】"+S.cons.map(function(i){return CONS[i];}).join("、"):"", "【回答方式】"+FMTS[S.fmt]+"。請先列出你用了哪些假設，每一步算式都要寫出來。","請不要給投資建議；如果資訊不夠，請先問我。"].filter(Boolean).join("\n");
}
function decisionText(){ if(S.decision==null) return ""; return DECISIONS[V().kind][S.decision]; }
function actionTextFinal(){ if(S.action==="custom") return S.actionText.trim(); if(S.action==null) return ""; return ACTIONS[V().kind][S.action]; }

/* ================= 框架 ================= */
function shell(inner){
  var back = S.screen==="intro" ? "" : '<button class="pill" data-act="back">‹ 上一步</button>';
  var n = NUM[S.screen], bar="";
  if(n){ bar='<div class="stage"><span>第 '+n+'／6 關</span><span class="habs">'+habitsBar()+'</span></div><div class="track">'+[1,2,3,4,5,6].map(function(i){return '<i class="'+(i<n?"done":(i===n?"now":""))+'"></i>';}).join("")+'</div>'; }
  var modal = S.confirm ? '<div class="modal"><div class="mbox"><h4>要重新開始嗎？</h4><p>目前的選擇和輸入都會清除，無法復原。</p><button class="cta" data-act="doRestart">確定，重新開始</button><button class="ghost" data-act="cancelRestart">先不要</button></div></div>' : "";
  return '<div class="top"><div class="brand"><div class="logo"></div><div><span class="en">FUTURE COMPASS</span><span class="zh">未來羅盤</span></div></div>'+back+'</div><div class="line"></div>'+bar+inner+modal;
}
function render(keep, anim){
  var y=window.scrollY;
  var fn={intro:rIntro,draw:rDraw,find:rFind,brief:rBrief,ask:rAsk,check:rCheck,decide:rDecide,res:rRes}[S.screen];
  var app=document.getElementById("app");
  app.className=""; app.innerHTML=shell(fn());
  if(anim){ void app.offsetWidth; app.className="enter"; }
  bindAll(); window.scrollTo(0,keep?y:0);
  if(S.screen==="draw" && S.vid && !S.flipped){ setTimeout(function(){ var c=document.getElementById("c3d"); if(c){ c.classList.add("flipped"); S.flipped=true; } },60); }
}

/* ================= 畫面 ================= */
function rIntro(){
  return '<div class="deck"><h2>💰 金錢探索<br>AI 理財實驗室</h2>'+
    aurora('<p>嗨，探員！👋</p><p>這次的任務有點特別：你要<b>真的去問 AI</b>，練習用它幫你想清楚金錢的問題。</p><p>不過，AI 會算錯、也會說得太肯定。所以你還要學會<b>找出它的破綻、自己重算</b>。</p><p>完成任務，就能獲得<b>金錢探索徽章</b>🏅。過程中會用到三個好習慣：🔍找碴、💬追問、🧮查核，會記錄在你的決策卡上。</p>')+
    '<div class="warn">📌 這是練習，不是理財或投資建議。<br>🔒 請不要在 AI 裡輸入真實姓名、帳號、卡號，或家裡的收入。任務裡的人物和數字都是虛構的。</div>'+
    '<div class="q">先選一個難度，再抽任務卡</div>'+
    '<div class="lv"><button class="lvb" data-act="level" data-v="easy"><b>🌱 入門</b><small>數字單純，AI 的錯誤比較明顯</small></button>'+
    '<button class="lvb" data-act="level" data-v="hard"><b>🔥 進階</b><small>要留意題目裡的條件，錯誤比較隱微</small></button></div>'+
    '<p class="hint" style="text-align:center;">大約 10 分鐘</p></div>';
}
function rDraw(){
  var v=V(), body="";
  var back='<div class="face back"><div class="coinimg"></div><p class="sub" style="margin:16px 0 0;">任務卡牌</p></div>';
  var front = v ? '<div class="face front"><span class="kind">'+KIND_LABEL[v.kind]+' ・ '+LEVEL_LABEL[v.level]+'</span><h3>'+v.icon+' '+esc(v.title)+'</h3><ul>'+v.story.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul></div>' : '<div class="face front"></div>';
  body='<div class="scene"><div class="card3d" id="c3d">'+back+front+'</div></div>';
  var btns = v ? go("find","就用這張，開始 AI 找碴")+'<button class="ghost" data-act="redraw">🔄 換一張</button>' : '<button class="cta" data-act="draw">🃏 抽一張任務卡</button>';
  return '<div class="deck"><h2>🃏 抽任務卡</h2><p class="sub">'+(v?"這是你的任務。人物和數字都是虛構的，放心練習。":"難度：<b>"+LEVEL_LABEL[S.level]+"</b>。點一下抽卡。")+'</p>'+body+btns+'</div>';
}
function rFind(){
  var v=V(), f=foundCount(), wrongN=wrongIdx(v).length;
  var sents=v.sentences.map(function(s,i){
    var on=has(S.picks,i), cls="sent", mk="覺得有問題";
    if(S.revealed){ cls+= s.wrong ? " bad" : " ok"; mk = s.wrong ? "❌ 有問題" : "✅ 正確"; if(on&&!s.wrong) mk="✅ 其實正確"; }
    else if(on){ cls+=" on"; mk="有問題"; }
    return '<div class="'+cls+'" '+(S.revealed?'':'data-act="pick" data-v="'+i+'"')+'><span class="n">'+(i+1)+'</span><div class="body">'+esc(s.t)+(S.revealed&&s.wrong?'<span class="why">💡 '+esc(s.why)+'</span>':'')+'</div><span class="mk">'+mk+'</span></div>';
  }).join("");
  var res="";
  if(S.revealed){
    var msg = f===wrongN ? "你把 AI 的破綻全抓出來了！" : (f>=1 ? "你抓到了 "+f+" 個。沒抓到的也很常見，AI 常常說得很有自信。" : "這次沒有抓到，沒關係。這就是為什麼要自己重算。");
    res=aurora('<p>這段回答裡藏了 '+wrongN+' 個有問題的句子，你找到 <b>'+f+'</b> 個。</p><p>'+msg+'</p>'+(f>=1?'<p>✓ 這是個好習慣：你有檢查 AI 的答案，而不是直接相信。</p>':''));
  }
  return '<div class="deck"><h2>🔍 AI 找碴</h2><div class="warn" style="margin-top:0">'+v.icon+' <b>'+esc(v.title)+'</b>：'+v.story.map(esc).join("；")+'</div>'+
    '<p class="sub">下面是一個 AI 的回答，裡面藏了 <b>'+wrongN+' 個</b>有問題的句子。點一下你覺得有問題的句子（可以不選）。</p>'+
    '<div class="ai"><div class="t">🤖 AI 的回答</div>'+sents+'</div>'+res+
    (S.revealed ? go("brief","下一關：換我問 AI") : '<button class="cta" data-act="reveal">🔎 揭曉答案</button>')+'</div>';
}
function rBrief(){
  var goals=GOALS.map(function(g,i){return bub("goal",i,S.goal===i,g);}).join("");
  var cons=CONS.map(function(g,i){return bub("con",i,has(S.cons,i),g);}).join("");
  var fm=FMTS.map(function(g,i){return bub("fmt",i,S.fmt===i,g);}).join("");
  return '<div class="deck"><h2>✍️ 寫給 AI 的任務簡報</h2><p class="sub">AI 答得好不好，很大一部分取決於你怎麼問。選一選，幫你組成一段完整的提問。</p>'+
    '<div class="q">我想知道什麼？</div><div class="bubs">'+goals+'</div>'+
    '<div class="q">有什麼要特別注意？<span class="hint"> 可多選</span></div><div class="bubs">'+cons+'</div>'+
    '<div class="q">希望 AI 怎麼回答？</div><div class="bubs">'+fm+'</div>'+
    '<div class="q">你的提問內容</div><div class="prompt" id="promptBox">'+esc(buildPrompt())+'</div>'+
    '<button class="copy" data-act="copy" data-v="prompt">📋 複製提問</button>'+
    '<div class="warn">① 複製後，開啟 Gemini 貼上。② 看完 AI 的第一個回答，再到下一關追問。<br>不要在 AI 裡加入姓名、帳號或家庭收入。</div>'+
    '<a class="cta" href="'+GEMINI_URL+'" target="_blank" rel="noopener">🚀 開啟 Gemini</a>'+
    go("ask","我問完了，去追問 AI")+
    '<button class="ghost" data-act="noai">我沒辦法用 AI，改看示範整理</button></div>';
}
function rAsk(){
  var fu=FOLLOWS.map(function(f,i){ return '<div class="fu">'+esc(f)+'<button class="copy" data-act="copy" data-v="fu'+i+'">📋 複製</button></div>'; }).join("");
  var chips=FOLLOWS.map(function(f,i){ return bub("follow",i,has(S.follows,i),esc(f.length>16?f.slice(0,16)+"…":f)); }).join("");
  var n=followCount();
  return '<div class="deck"><h2>💬 追問 AI</h2>'+
    aurora('<p>第一個回答通常只是起點。好的提問者會<b>追問</b>：問假設、換數字、問風險。</p><p>請至少追問 <b>2 次</b>，下面是一些可以直接複製的追問。</p>')+
    '<div class="q">可以這樣追問</div>'+fu+
    '<div class="q">你實際追問了哪些？</div><p class="hint">👆 點一下勾選，決策卡會寫上你的追問</p><div class="bubs">'+chips+'</div>'+
    '<input class="txt" id="inFollow" maxlength="60" placeholder="你自己還問了什麼？（可以不填）" value="'+esc(S.followOther)+'">'+
    '<p class="hint">已追問 <b>'+n+'</b> 個'+(n<2?"（追問 2 次以上更好）":"，✓ 這是個好習慣！")+'</p>'+
    go("check","下一關：AI 查核站")+'</div>';
}
function rCheck(){
  var v=V(), done=S.chkDone, results=done?checkResults():null;
  var rows=v.checks.map(function(c,i){
    var r=results?results[i]:null;
    return '<div class="qrow"><label>'+(i+1)+'. '+esc(c.q)+'</label><div class="inp"><input class="txt" inputmode="decimal" data-chk="'+i+'" placeholder="你算出的數字" value="'+esc(S.chk[i])+'"'+(done?" disabled":"")+'><span class="unit">'+c.unit+'</span></div>'+
      (r?'<div class="res '+(r.ok?"ok":"bad")+'">'+(r.ok?"✅ 答對了":"❌ 正確答案是 "+fmt(c.ans)+" "+c.unit+"，你算的是 "+(r.val||"（沒填）"))+'</div>':'')+'</div>';
  }).join("");
  var aiLine="";
  if(done && String(S.aiNum).trim()!==""){
    var a=parseFloat(String(S.aiNum).replace(/,/g,"")); var c0=v.checks[0].ans;
    aiLine = isNaN(a) ? "" : (Math.abs(a-c0)<=v.checks[0].tol ? '<div class="res ok">🤖 AI 給你的第一個數字（'+fmt(a)+'）和正確答案一致。</div>' : '<div class="res bad">🤖 AI 給你的第一個數字（'+fmt(a)+'）和正確答案（'+fmt(c0)+'）差了 '+fmt(Math.abs(a-c0))+'。可能是算錯，也可能用了不同的假設，請回去追問它。</div>');
  }
  var demo="";
  if(S.noAI){
    demo='<div class="demo"><div class="t">✅ 示範整理（已修正的版本）</div>'+v.sentences.map(function(s){return '<p>• '+esc(s.wrong?s.fix:s.t)+'</p>';}).join("")+'</div>';
  }
  var cks=["我有自己重算過數字","我知道 AI 用了哪些假設","我知道哪些事要問大人，或查可信的來源"].map(function(t,i){ return '<div class="ck'+(S.ck[i]?" on":"")+'" data-act="ck" data-v="'+i+'"><span class="bx">'+(S.ck[i]?"✓":"")+'</span><span>'+t+'</span></div>'; }).join("");
  var okN=done?results.filter(function(r){return r.ok;}).length:0;
  var tips=done?aurora('<p>重算不是不信任 AI，而是<b>確認它的答案能不能拿來做決定</b>。</p>'+(okN>=2?'<p>✓ 這是個好習慣：你自己算對了 '+okN+' 題。</p>':'<p>這次算對 '+okN+' 題。多重算幾次，會越來越熟練。</p>')):"";
  return '<div class="deck"><h2>🧮 AI 查核站</h2><div class="warn" style="margin-top:0">'+v.icon+' <b>'+esc(v.title)+'</b>：'+v.story.map(esc).join("；")+'</div>'+
    (S.noAI?'<p class="sub">這次沒有使用 AI，先看示範整理，再自己重算下面三題。</p>'+demo:'<p class="sub">不要直接相信 AI。用計算機或紙筆，<b>自己重算</b>下面三題。</p>')+
    rows+
    (S.noAI?'':'<div class="qrow"><label>（選填）AI 給你的第一題數字是多少？</label><div class="inp"><input class="txt" id="inAiNum" inputmode="decimal" placeholder="AI 說的數字" value="'+esc(S.aiNum)+'"'+(done?" disabled":"")+'></div></div>')+
    aiLine+
    (done?'':'<button class="cta" data-act="docheck">✅ 核對答案</button>')+tips+
    '<div class="q">查核清單</div>'+cks+
    '<div class="q">我查核後發現／調整的地方（可以先空白）</div><textarea class="txt" id="inAdjust" placeholder="例如：AI 一開始漏算了違約金，我追問後才補上">'+esc(S.adjust)+'</textarea>'+
    go("decide","下一關：我的決定")+'</div>';
}
function rDecide(){
  var v=V(), k=v.kind;
  var ds=DECISIONS[k].map(function(t,i){ var on=S.decision===i; return '<div class="ck'+(on?" on":"")+'" data-act="dec" data-v="'+i+'"><span class="bx">'+(on?"●":"")+'</span><span>'+t+'</span></div>'; }).join("");
  var as=ACTIONS[k].map(function(t,i){ var on=S.action===i; return '<div class="ck'+(on?" on":"")+'" data-act="act" data-v="'+i+'"><span class="bx">'+(on?"●":"")+'</span><span>'+t+'</span></div>'; }).join("");
  var cu=S.action==="custom";
  as+='<div class="ck'+(cu?" on":"")+'" data-act="act" data-v="custom"><span class="bx">'+(cu?"●":"")+'</span><span>✍️ 我想自己寫一個</span></div>'+(cu?'<input class="txt" id="inAction" maxlength="60" placeholder="我的小行動是…" value="'+esc(S.actionText)+'">':"");
  var ok = S.decision!=null && !!actionTextFinal();
  return '<div class="deck"><h2>🧭 我的決定</h2>'+
    aurora('<p>AI 只是幫你想，<b>決定的人是你</b>。選哪個都可以，重點是你知道為什麼。</p>')+
    '<div class="q">我的決定</div><p class="hint">👆 點一下選擇</p>'+ds+
    '<div class="q">AI 建議我…（選填，用你自己的話寫）</div><textarea class="txt" id="inAdvice" placeholder="例如：AI 建議先存錢，但我覺得⋯⋯">'+esc(S.aiAdvice)+'</textarea>'+
    '<div class="q">下一個小行動</div>'+as+
    '<button class="cta" data-act="go" data-v="res" '+(ok?"":"disabled")+'>🧾 產生我的金錢決策卡</button>'+
    (ok?'':'<p class="hint" style="text-align:center;margin-top:8px;">選好「我的決定」和「小行動」就可以產生</p>')+'</div>';
}
function recSections(){
  var v=V(), f=foundCount(), wn=wrongIdx(v).length, secs=[];
  secs.push({h:"🧾 任務",t:v.icon+" "+v.title+"（"+KIND_LABEL[v.kind]+"／"+LEVEL_LABEL[v.level]+"）\n"+v.story.join("；")+"。"});
  secs.push({h:"🔍 AI 找碴",t: S.revealed ? "我找到 "+f+"／"+wn+" 個有問題的句子" : "這次沒有進行"});
  if(S.noAI) secs.push({h:"💬 我怎麼問 AI",t:"這次沒有使用 AI，改看示範整理。"});
  else {
    var fl=S.follows.map(function(i){return FOLLOWS[i];}); if(S.followOther.trim()) fl.push(S.followOther.trim());
    secs.push({h:"💬 我怎麼問 AI",t:"我想知道：" + GOALS[S.goal] + "\n我的追問（"+fl.length+" 次）：" + (fl.length?fl.join("；"):"沒有記錄")});
  }
  if(S.chkDone){ var r=checkResults(); secs.push({h:"🧮 我自己重算",t:r.map(function(x){return x.q.replace(/（.*?）/,"")+" ▸ "+(x.ok?"✅ 算對 "+fmt(x.ans)+x.unit:"❌ 我算 "+(x.val||"（沒填）")+"，正確是 "+fmt(x.ans)+x.unit);}).join("\n")}); }
  var cks=["有自己重算過數字","知道 AI 用了哪些假設","知道哪些事要問大人或查可信來源"].filter(function(t,i){return S.ck[i];});
  if(cks.length) secs.push({h:"📋 我的查核",t:"✔ "+cks.join("\n✔ ")});
  if(S.adjust.trim()) secs.push({h:"🛠️ 我查核後發現／調整的地方",t:S.adjust.trim()});
  if(S.aiAdvice.trim()) secs.push({h:"🤖 AI 建議我",t:S.aiAdvice.trim()});
  var hs=habits().filter(function(h){return h.ok;});
  secs.push({h:"✅ 我用到的好習慣",t: hs.length ? hs.map(function(h){return "✓ "+h.name+"：我"+h.desc;}).join("\n") : "這次還在練習中"});
  secs.push({h:"✅ 我的決定",t:decisionText()});
  secs.push({h:"🌱 下一個小行動",t:actionTextFinal()});
  return secs;
}
function rRes(){
  var secs=recSections().map(function(s){ return '<div class="rsec"><h4>'+s.h+'</h4>'+s.t.split("\n").map(function(l){return '<p>'+esc(l)+'</p>';}).join("")+'</div>'; }).join("");
  return '<div class="deck"><div class="flipcoin"></div><div class="got"><b>🏅 獲得金錢探索徽章</b></div>'+
    '<div class="q" style="text-align:center;margin-bottom:0;">我用到的好習慣</div><div class="habrow">'+habits().map(function(h){return '<div class="habc'+(h.ok?" on":"")+'"><div class="c">'+h.icon+'</div><b>'+h.name+'</b><small>'+(h.ok?h.desc:"這次還在練習中")+'</small></div>';}).join("")+'</div>'+
    '<p class="hint" style="text-align:center;margin-top:8px;">這些是你這次用 AI 的好習慣紀錄，完成任務就能獲得徽章。</p></div>'+
    '<div class="receipt"><h3>金錢決策卡</h3><div class="sm">FUTURE COMPASS ｜ MONEY LAB</div>'+secs+'<div class="rfoot">這是練習，不是理財或投資建議</div></div>'+
    '<div class="report"><div class="rp-title">✨ 探索完成！</div><div class="rp-step">📸 ① 截圖你的「金錢決策卡」<small>請確認截圖包含整張卡片，或按下面「下載」取得完整圖片</small></div><div class="rp-step">💬 ② 回到 LINE 聊天室傳送圖片</div><div class="rp-step">🚀 ③ 再輸入【金錢回報】</div><div class="rp-chips"><span>⭐ 任務積分 +10</span><span>🌌 探索進度 +2%</span><span>🏅 獲得金錢探索徽章</span></div></div>'+
    '<a class="cta" href="'+LINE_URL+'">回到 LINE</a>'+
    '<button class="ghost" data-act="download">📥 下載我的金錢決策卡</button>'+
    '<button class="ghost" data-act="go" data-v="decide">回頭修改</button>'+
    '<button class="ghost" data-act="askRestart">♻️ 重新開始（抽新的任務）</button>';
}

/* ================= 事件 ================= */
function copyText(text, el){
  function done(){ var o=el.textContent; el.textContent="已複製 ✓"; setTimeout(function(){ el.textContent=o; },1400); }
  function fallback(){ var ta=document.createElement("textarea"); ta.value=text; ta.style.cssText="position:fixed;opacity:0;left:-9999px"; document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ el.textContent="請長按文字複製"; } document.body.removeChild(ta); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); } else fallback();
}
function bindAll(){
  document.querySelectorAll("[data-act]").forEach(function(el){ el.addEventListener("click",function(){ act(el.getAttribute("data-act"),el.getAttribute("data-v"),el); }); });
  function bi(id,fn){ var e=document.getElementById(id); if(e) e.addEventListener("input",function(){ fn(e.value); }); }
  bi("inFollow",function(v){ S.followOther=v; });
  bi("inAiNum",function(v){ S.aiNum=v; });
  bi("inAdjust",function(v){ S.adjust=v; });
  bi("inAdvice",function(v){ S.aiAdvice=v; });
  bi("inAction",function(v){ S.actionText=v; var b=document.querySelector(".cta[data-v=res]"); if(b) b.disabled=!(S.decision!=null && actionTextFinal()); });
  document.querySelectorAll("[data-chk]").forEach(function(e){ e.addEventListener("input",function(){ S.chk[parseInt(e.getAttribute("data-chk"),10)]=e.value; }); });
}
function nextScreen(from, dir){
  var i=ORDER.indexOf(from)+dir, to=ORDER[i];
  if(S.noAI){ if(from==="brief"&&dir>0) return "check"; if(from==="check"&&dir<0) return "brief"; }
  return to;
}
function pickVariant(){
  var pool=VARIANTS.filter(function(v){ return v.level===S.level && v.id!==S.vid; });
  S.vid=pool[Math.floor(Math.random()*pool.length)].id;
}
function resetRound(){ S.picks=[]; S.revealed=false; S.noAI=false; S.goal=0; S.cons=[0]; S.fmt=0; S.follows=[]; S.followOther=""; S.chk=["","",""]; S.aiNum=""; S.chkDone=false; S.ck=[false,false,false]; S.adjust=""; S.aiAdvice=""; S.decision=null; S.action=null; S.actionText=""; }
function act(a,v,el){
  var keep=true, anim=false;
  if(a==="level"){ S.level=v; S.vid=null; S.flipped=false; resetRound(); S.screen="draw"; keep=false; anim=true; }
  else if(a==="draw"){ pickVariant(); S.flipped=false; resetRound(); keep=false; }
  else if(a==="redraw"){ pickVariant(); S.flipped=false; resetRound(); keep=false; }
  else if(a==="go"){ S.screen=v; keep=false; anim=true; }
  else if(a==="back"){ S.screen=nextScreen(S.screen,-1); keep=false; anim=true; }
  else if(a==="pick"){ tog(S.picks,parseInt(v,10)); }
  else if(a==="reveal"){ S.revealed=true; }
  else if(a==="goal"){ S.goal=parseInt(v,10); }
  else if(a==="con"){ tog(S.cons,parseInt(v,10)); }
  else if(a==="fmt"){ S.fmt=parseInt(v,10); }
  else if(a==="copy"){ copyText(v==="prompt"?buildPrompt():FOLLOWS[parseInt(v.slice(2),10)], el); return; }
  else if(a==="noai"){ S.noAI=true; S.screen="check"; keep=false; anim=true; }
  else if(a==="follow"){ tog(S.follows,parseInt(v,10)); }
  else if(a==="docheck"){ S.chkDone=true; }
  else if(a==="ck"){ var i=parseInt(v,10); S.ck[i]=!S.ck[i]; }
  else if(a==="dec"){ S.decision=parseInt(v,10); }
  else if(a==="act"){ S.action = (v==="custom") ? "custom" : parseInt(v,10); }
  else if(a==="download"){ share(); return; }
  else if(a==="askRestart"){ S.confirm=true; }
  else if(a==="cancelRestart"){ S.confirm=false; }
  else if(a==="doRestart"){ S=fresh(); keep=false; anim=true; }
  render(keep,anim);
}

/* ================= 下載圖片 ================= */
function share(){
  var W=720,P=64,F="'PingFang TC','Microsoft JhengHei',sans-serif",BODY=17,LH=28;
  var m=document.createElement("canvas").getContext("2d"); m.font=BODY+"px "+F;
  function wl(text,maxW){ var out=[],line=""; text.split("").forEach(function(ch){ var t=line+ch; if(m.measureText(t).width>maxW&&line!==""){out.push(line);line=ch;}else line=t; }); if(line) out.push(line); return out; }
  var blocks=recSections();
  blocks.forEach(function(b){ b.lines=[]; b.t.split("\n").forEach(function(par){ wl(par,W-P*2).forEach(function(l){ b.lines.push(l); }); }); });
  var H=330; blocks.forEach(function(b){ H+=46+b.lines.length*LH+24; }); H=Math.max(H+100,860);
  var img=new Image();
  img.onload=function(){
    var c=document.createElement("canvas"); c.width=W; c.height=H; var x=c.getContext("2d");
    var g=x.createRadialGradient(W*.7,0,0,W/2,H*.4,H); g.addColorStop(0,"#2a1c09"); g.addColorStop(1,"#140f08"); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.strokeStyle="rgba(224,160,48,.55)"; x.lineWidth=2; x.strokeRect(26,30,W-52,H-60);
    x.save(); x.beginPath(); x.arc(W/2,128,56,0,7); x.clip(); x.drawImage(img,W/2-56,72,112,112); x.restore();
    x.strokeStyle="#e0a030"; x.lineWidth=3; x.beginPath(); x.arc(W/2,128,57,0,7); x.stroke();
    x.textAlign="center"; x.font="bold 28px "+F; x.fillStyle="#ffffff"; x.fillText("未來羅盤｜金錢探索結果",W/2,236);
    x.font="15px "+F; x.fillStyle="#f4ce81"; x.fillText("AI 理財實驗室｜我的金錢決策卡",W/2,266); x.font="13px monospace"; x.fillStyle="#d9c9a3"; x.fillText("FC-MONEY / RESULT",W/2,292);
    x.textAlign="left"; var y=340;
    blocks.forEach(function(b){ x.strokeStyle="rgba(255,255,255,.18)"; x.lineWidth=1; x.setLineDash([4,5]); x.beginPath(); x.moveTo(P,y-22); x.lineTo(W-P,y-22); x.stroke(); x.setLineDash([]);
      x.font="bold 20px "+F; x.fillStyle="#f4ce81"; x.fillText(b.h,P,y+6); y+=46; x.font=BODY+"px "+F; x.fillStyle="#f6ecd9"; b.lines.forEach(function(l){ x.fillText(l,P,y); y+=LH; }); y+=24; });
    x.textAlign="center"; x.font="14px "+F; x.fillStyle="#d9c9a3"; x.fillText("這是練習，不是理財或投資建議",W/2,H-56);
    document.getElementById("shareImg").src=c.toDataURL("image/png"); document.getElementById("shareBox").classList.add("show");
  };
  img.src=BADGE;
}

render(false,false);
</script>
