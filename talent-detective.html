<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>能力探索｜能力鑑識所</title>
<style>
  :root {
    --bg: #0b0d13;
    --panel: #12151e;
    --panel2: #181c28;
    --yellow: #ffd23f;
    --yellow-soft: #ffe68a;
    --yellow-dim: rgba(255, 210, 63, 0.22);
    --gold: #e8c988;
    --paper: #e8d9a6;
    --paper-dark: #cdb978;
    --ink: #1d1808;
    --text: #eef0f4;
    --dim: #8d94a6;
    --red: #ff5a5a;
    --mono: "SFMono-Regular", "JetBrains Mono", "Menlo", "Courier New", monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    background:
      linear-gradient(rgba(255,210,63,0.045) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,210,63,0.045) 1px, transparent 1px) 0 0 / 28px 28px,
      radial-gradient(ellipse at 50% -10%, #1a1d2b 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height: 100%;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .scanbeam { position: fixed; left: 0; right: 0; top: -140px; height: 140px; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, transparent, rgba(255,210,63,0.07), transparent);
    animation: beamDown 9s linear infinite; }
  @keyframes beamDown { from { transform: translateY(0); } to { transform: translateY(calc(100vh + 280px)); } }

  #app {
    position: relative; z-index: 1;
    max-width: clamp(320px, 92vw, 440px);
    margin: 0 auto;
    padding: clamp(16px, 5vw, 22px) clamp(14px, 5vw, 20px) 44px;
    min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  @media (min-width: 640px) { #app { max-width: 500px; padding-top: 36px; } .logo-icon { width: 42px; height: 42px; } }
  @media (min-width: 1024px) { #app { max-width: 540px; padding-top: 52px; } }

  /* ---------- 品牌頁首 ---------- */
  .logo-row { display: flex; align-items: center; justify-content: space-between; gap: 11px; margin-bottom: 10px; }
  .logo-left { display: flex; align-items: center; gap: 11px; }
  .logo-icon { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .logo-text { display: flex; flex-direction: column; }
  .logo-text .en { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; color: var(--gold); }
  .logo-text .zh { font-size: 15px; font-weight: 800; color: var(--text); margin-top: 2px; }
  .logo-underline { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); opacity: 0.5; margin: 0 0 14px; }
  .logo-right .pill-btn { background: transparent; border: 1px solid var(--yellow-dim); color: var(--dim); border-radius: 6px; padding: 8px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; }

  /* ---------- 鑑識進度列 ---------- */
  .tracker { display: flex; gap: 5px; margin: 0 0 16px; }
  .trk { flex: 1; text-align: center; font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; color: #5c6275; padding: 6px 0 0; border-top: 3px solid rgba(255,255,255,0.1); }
  .trk.done { border-color: var(--yellow-dim); color: var(--dim); }
  .trk.on { border-color: var(--yellow); color: var(--yellow); font-weight: 700; }

  /* ---------- 案件檔案夾 ---------- */
  .case { position: relative; margin-bottom: 18px; }
  .case-tab { display: inline-block; background: var(--yellow); color: var(--ink); font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; font-weight: 800; padding: 6px 14px; border-radius: 6px 6px 0 0; }
  .case-body { position: relative; background: var(--panel); border: 1px solid rgba(255,210,63,0.35); border-radius: 0 8px 8px 8px; padding: 0 18px 22px; overflow: hidden; }
  .case-body::after { content: ""; position: absolute; right: 8px; bottom: 8px; width: 16px; height: 16px; border-right: 2px solid var(--yellow); border-bottom: 2px solid var(--yellow); opacity: 0.7; }
  .case-tape { height: 10px; margin: 0 -18px 16px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, #15171e 10px 20px); opacity: 0.92; }
  .case-q { font-size: 14px; font-weight: 800; color: var(--yellow); margin: 2px 0 12px; display: flex; align-items: center; gap: 8px; }
  .case-q::before { content: "▌"; color: var(--yellow); }

  .headline { font-size: 24px; font-weight: 900; line-height: 1.32; margin: 0 0 10px; letter-spacing: 0.5px; }
  .body-copy { font-size: 13px; color: var(--dim); line-height: 1.75; margin: 0 0 4px; }

  /* ---------- 按鈕（硬體按鍵風） ---------- */
  .cta { display: flex; align-items: center; justify-content: space-between; gap: 9px; width: 100%; border: none; border-radius: 8px; padding: 15px 16px 15px 18px; margin-top: 20px; background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 4px 0 #a88a12; transition: transform .08s, box-shadow .08s; }
  .cta:active { transform: translateY(3px); box-shadow: 0 1px 0 #a88a12; }
  .cta .arrow { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: var(--ink); color: var(--yellow); font-size: 12px; }
  .cta:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
  .footer-actions { margin-top: auto; padding-top: 6px; }

  /* ---------- Aurora 現場筆記 ---------- */
  .aurora-signature { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--yellow-dim); background: rgba(255,210,63,0.04); border-radius: 6px; padding: 12px; margin: 4px 0 20px; position: relative; }
  .aurora-signature::before { content: ""; position: absolute; top: -6px; left: 18px; width: 38px; height: 12px; background: rgba(255,210,63,0.5); transform: rotate(-3deg); }
  .owl-avatar { width: 40px; height: 40px; flex-shrink: 0; }
  .aurora-signature .label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; font-weight: 700; color: var(--yellow); margin-bottom: 4px; display: block; }
  .aurora-signature p { margin: 0; font-size: 12.5px; line-height: 1.65; color: var(--dim); }

  /* ---------- 首頁 ---------- */
  .fp-wrap { position: relative; width: 112px; height: 112px; margin: 6px auto 14px; border: 1.5px solid var(--yellow-dim); border-radius: 10px; overflow: hidden; background: rgba(255,210,63,0.04); }
  .fp-wrap svg { width: 100%; height: 100%; }
  .fp-scan { position: absolute; left: 0; right: 0; height: 3px; background: var(--yellow); box-shadow: 0 0 12px var(--yellow); animation: fpScan 2.4s ease-in-out infinite; }
  @keyframes fpScan { 0%,100% { top: 4%; } 50% { top: 94%; } }
  .home-title { text-align: center; }
  .home-title .headline { font-size: 28px; margin-bottom: 4px; }
  .home-title .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--dim); margin-bottom: 16px; }
  .brief-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .brief-list li { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--text); padding: 9px 0; border-top: 1px dashed rgba(255,255,255,0.1); }
  .brief-list li:first-child { border-top: none; }
  .brief-list .bx { font-family: var(--mono); color: var(--yellow); font-size: 11px; flex-shrink: 0; }

  /* ---------- 玩法介紹 ---------- */
  .howto-list { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 6px; }
  .howto-item { display: flex; gap: 12px; align-items: flex-start; border-left: 3px solid var(--yellow); background: rgba(255,255,255,0.03); border-radius: 4px; padding: 11px 12px; }
  .howto-item .num { font-size: 18px; flex-shrink: 0; }
  .howto-item h3 { margin: 0 0 3px; font-size: 13px; font-weight: 700; }
  .howto-item p { margin: 0; font-size: 11.5px; color: var(--dim); line-height: 1.55; }

  /* ---------- STEP1 現場證物 ---------- */
  .select-count { text-align: center; font-size: 12px; color: var(--dim); margin: 2px 0 12px; font-family: var(--mono); letter-spacing: 0.04em; }
  .select-count b { color: var(--yellow); }
  .event-cat { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--yellow); margin: 16px 0 8px; opacity: 0.85; }
  .event-cat:first-of-type { margin-top: 4px; }
  .evi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .event-card { position: relative; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 12px 11px 12px; cursor: pointer; min-height: 104px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .event-card .tent { align-self: flex-start; background: var(--yellow); color: var(--ink); font-family: var(--mono); font-size: 10px; font-weight: 800; padding: 2px 7px 2px 6px; clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); }
  .event-card .icon { font-size: 18px; position: absolute; top: 10px; right: 10px; }
  .event-card .txt { font-size: 11.5px; font-weight: 600; line-height: 1.5; margin-top: 2px; }
  .event-card.selected { border-color: var(--yellow); background: rgba(255,210,63,0.1); }
  .event-card.selected::after { content: "已採證"; position: absolute; right: 6px; bottom: 8px; transform: rotate(-9deg); font-size: 11px; font-weight: 900; color: var(--yellow); border: 2px solid var(--yellow); border-radius: 4px; padding: 1px 6px; letter-spacing: 0.08em; background: rgba(11,13,19,0.7); }
  .event-card.idk { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; opacity: 0.85; border-style: dashed; }
  .event-card.idk .icon { position: static; }
  .event-card.disabled { opacity: 0.28; pointer-events: none; }

  /* ---------- STEP2 監視器回放 ---------- */
  .cctv { position: relative; background: #07090d; border: 1px solid rgba(255,210,63,0.4); border-radius: 6px; padding: 12px 14px 14px; margin-bottom: 16px; overflow: hidden; }
  .cctv::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px); pointer-events: none; }
  .cctv-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 10px; position: relative; }
  .cctv-top .rec { color: var(--red); font-weight: 700; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .cctv-event { display: flex; align-items: center; gap: 10px; position: relative; }
  .cctv-event .icon { font-size: 22px; }
  .cctv-event .txt { font-size: 13px; font-weight: 700; line-height: 1.5; }

  .action-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
  .action-btn { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border-left: 3px solid rgba(255,210,63,0.25); border-radius: 4px; padding: 11px 12px; cursor: pointer; text-align: left; font-size: 12.5px; font-weight: 600; position: relative; }
  .action-btn .no { font-family: var(--mono); font-size: 10px; color: var(--yellow); opacity: 0.8; flex-shrink: 0; }
  .action-btn.picked { border-left-color: var(--yellow); background: rgba(255,210,63,0.12); }
  .action-btn.picked::after { content: "已記錄"; margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--yellow); }
  .action-other-input { width: 100%; margin-top: -2px; margin-bottom: 14px; padding: 11px 12px; border-radius: 4px; border: 1px solid var(--yellow); background: #07090d; color: var(--yellow-soft); font-size: 12.5px; font-family: var(--mono); }
  .followup-label { font-size: 11.5px; color: var(--dim); margin: 4px 0 8px; font-family: var(--mono); }
  .followup-input { width: 100%; padding: 11px 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); background: #07090d; color: var(--text); font-size: 12.5px; margin-bottom: 4px; font-family: inherit; resize: none; }
  .followup-input::placeholder { color: #5c6275; }

  /* ---------- STEP3 鑑識掃描 ---------- */
  .forensic-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--yellow); margin-bottom: 10px; }
  .forensic-quote { background: rgba(255,255,255,0.04); border-left: 3px solid var(--yellow); border-radius: 4px; padding: 12px 14px; font-size: 13px; line-height: 1.65; margin-bottom: 14px; }
  .forensic-quote b { color: var(--yellow-soft); }
  .scan-wrap { margin-bottom: 14px; }
  .scan-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; color: var(--dim); margin-bottom: 6px; animation: scanLabel 1.2s forwards; }
  @keyframes scanLabel { 0%, 85% { opacity: 1; } 100% { opacity: 0.35; } }
  .scan-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .scan-bar i { display: block; height: 100%; width: 0; background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation: scanFill 1.1s ease-out forwards; }
  @keyframes scanFill { to { width: 100%; } }
  .reveal-block { opacity: 0; animation: revealUp 0.55s 1.15s forwards; }
  @keyframes revealUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .found-tag { border: 1px solid var(--yellow); background: rgba(255,210,63,0.08); border-radius: 6px; padding: 14px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .found-tag .icon { font-size: 34px; }
  .found-tag .small { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; color: var(--yellow); margin-bottom: 3px; }
  .found-tag .ability-name { font-size: 18px; font-weight: 900; }
  .forensic-basis { font-size: 12px; color: var(--dim); line-height: 1.7; background: rgba(255,255,255,0.03); border-radius: 4px; padding: 11px 13px; }
  .forensic-basis b { color: var(--yellow); font-weight: 700; }

  /* ---------- STEP4 證物標籤 ---------- */
  .ability-card { position: relative; background: var(--panel2); border: 1px solid rgba(255,210,63,0.3); border-radius: 4px 14px 14px 4px; padding: 14px 14px 14px 18px; margin-bottom: 14px; }
  .ability-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--yellow); border-radius: 4px 0 0 4px; }
  .tag-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .tag-top .hole { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--yellow); background: var(--bg); }
  .tag-top .tag-no { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; color: var(--dim); flex: 1; }
  .confidence-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 3px; border: 1px dashed rgba(255,255,255,0.25); color: var(--dim); white-space: nowrap; }
  .confidence-tag.strong { color: var(--ink); background: var(--yellow); border: 1px solid var(--yellow); font-weight: 800; }
  .ability-card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ability-card .head .icon { font-size: 24px; }
  .ability-card .head h4 { margin: 0; font-size: 16px; font-weight: 900; }
  .ability-card p.desc { margin: 0 0 10px; font-size: 12.5px; color: var(--dim); line-height: 1.65; }
  .ability-card .evidence-box { font-size: 11.5px; color: var(--dim); line-height: 1.6; background: #0b0d13; border-radius: 4px; padding: 9px 11px; margin-bottom: 12px; font-family: inherit; }
  .ability-card .evidence-box div { margin-bottom: 4px; }
  .ability-card .evidence-box div:last-child { margin-bottom: 0; }
  .reaction-row { display: flex; gap: 7px; }
  .reaction-btn { flex: 1; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: var(--dim); border-radius: 4px; padding: 9px 4px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
  .reaction-btn.active-yes { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
  .reaction-btn.active-maybe { background: rgba(255,210,63,0.16); color: var(--yellow); border-color: rgba(255,210,63,0.5); }

  /* ---------- STEP5 能力檔案 ---------- */
  .declass { text-align: center; padding: 4px 0 2px; }
  .stamp { display: inline-block; font-family: var(--mono); font-weight: 900; letter-spacing: 0.16em; font-size: 13px; color: var(--yellow); border: 3px solid var(--yellow); border-radius: 6px; padding: 6px 16px; transform: rotate(-6deg); margin: 6px 0 14px; animation: stampIn .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stampIn { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
  .declass .headline { font-size: 24px; margin-bottom: 6px; }
  .declass .subtitle { font-size: 12.5px; color: var(--dim); }

  .dossier { position: relative; margin: 22px 0 18px; }
  .dossier-tab { display: inline-block; background: var(--paper-dark); color: var(--ink); font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; font-weight: 800; padding: 6px 14px; border-radius: 6px 6px 0 0; }
  .dossier-paper { background: var(--paper); color: var(--ink); border-radius: 0 6px 6px 6px; padding: 16px 16px 14px; box-shadow: 0 14px 30px rgba(0,0,0,0.4);
    background-image: repeating-linear-gradient(180deg, transparent 0 25px, rgba(29,24,8,0.07) 25px 26px); }
  .dp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 12px; }
  .dp-head .t { font-size: 15px; font-weight: 900; line-height: 1.35; }
  .dp-head .no { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-align: right; opacity: 0.7; line-height: 1.5; }
  .dp-stat { font-size: 11.5px; opacity: 0.75; margin-bottom: 12px; }
  .bp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .bp-tile { background: rgba(255,255,255,0.45); border: 1.5px solid var(--ink); border-radius: 4px; padding: 10px 10px 9px; }
  .bp-tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .bp-tile .ic { font-size: 26px; display: block; margin-bottom: 4px; }
  .bp-tile h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 900; }
  .bp-tile p { margin: 0 0 5px; font-size: 11px; line-height: 1.5; opacity: 0.82; }
  .bp-tile .ev { font-size: 10.5px; line-height: 1.5; border-top: 1px dashed rgba(29,24,8,0.4); padding-top: 5px; opacity: 0.9; }
  .bp-tile .flag { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 800; background: var(--ink); color: var(--yellow); padding: 1px 7px; border-radius: 3px; }
  .dp-foot { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; margin-top: 12px; font-family: var(--mono); letter-spacing: 0.06em; }

  .aurora-panel { border: 1px solid var(--yellow-dim); background: rgba(255,210,63,0.04); border-radius: 6px; padding: 16px; margin-bottom: 16px; position: relative; }
  .aurora-panel::before { content: ""; position: absolute; top: -6px; right: 22px; width: 38px; height: 12px; background: rgba(255,210,63,0.5); transform: rotate(3deg); }
  .aurora-panel .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .aurora-panel .panel-head .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; font-weight: 700; color: var(--yellow); }
  .aurora-panel p { margin: 0 0 11px; font-size: 12.5px; line-height: 1.75; color: var(--dim); }
  .aurora-panel p:last-child { margin-bottom: 0; }
  .aurora-panel .tip-line { color: var(--yellow-soft); font-size: 11.8px; opacity: 0.9; }

  /* ---------- 分享卡 overlay ---------- */
  .share-overlay { position: fixed; inset: 0; background: rgba(3,3,8,0.92); display: none; align-items: center; justify-content: center; z-index: 200; padding: 24px; flex-direction: column; }
  .share-overlay.show { display: flex; }
  .share-overlay img { max-width: 320px; width: auto; max-height: 76vh; object-fit: contain; border-radius: 8px; box-shadow: 0 0 50px rgba(255,210,63,0.2); }
  .share-hint { color: var(--dim); font-size: 12px; margin: 16px 0; text-align: center; }
  .share-overlay button { background: var(--panel); border: 1px solid var(--yellow-dim); color: var(--text); border-radius: 6px; padding: 9px 26px; font-size: 13px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { .scanbeam, .fp-scan, .cctv-top .rec, .scan-bar i, .stamp { animation: none !important; } .scan-bar i { width: 100%; } .reveal-block { opacity: 1; animation: none; } }

  .report { border: 1px solid rgba(255,210,63,.45); background: rgba(255,210,63,.06); border-radius: 16px; padding: 16px; margin: 16px 0 6px; }
  .report .rp-title { font-weight: 800; font-size: 15px; margin-bottom: 10px; }
  .report .rp-step { font-size: 14px; line-height: 1.7; margin: 6px 0; }
  .report .rp-step small { display: block; font-size: 11.5px; opacity: .7; margin-left: 1.6em; }
  .report .rp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .report .rp-chips span { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); }
  a.rp-line { display: block; text-align: center; text-decoration: none; margin-top: 12px; padding: 15px 18px; border-radius: 8px; }
</style>
</head>
<body>

<div class="scanbeam"></div>
<div id="app"></div>

<div class="share-overlay" id="shareOverlay">

function renderTracker() {
  var idx = -1;
  TRACK.forEach(function(t, i) { if (t.k === state.screen) idx = i; });
  if (idx === -1) return "";
  var html = '<div class="tracker">';
  TRACK.forEach(function(t, i) {
    var cls = i < idx ? "trk done" : (i === idx ? "trk on" : "trk");
    html += '<div class="' + cls + '">' + t.ic + ' ' + (i + 1) + '/5<br>' + t.t + '</div>';
  });
  return html + '</div>';
}

    '</div>' +
    '<div class="logo-underline"></div>' +
    renderTracker()
  );
}

// 案件檔案夾：分頁籤＋警戒膠帶＋內容區
function cardOpen(eyebrowIcon, eyebrowText, routeLabel, badgeIcon) {
  return (
    '<div class="case">' +
      '<div class="case-tab">' + routeLabel + '</div>' +
      '<div class="case-body">' +
        '<div class="case-tape"></div>' +
        '<div class="case-q">' + eyebrowIcon + ' ' + eyebrowText + '</div>'
  );
}
var CARD_CLOSE = '</div></div>';

function auroraSignature(label, text) {
  return (
    '<div class="aurora-signature">' + OWL_SVG +
      '<div><span class="label">AURORA ▸ ' + label + '</span><p>' + text + '</p></div>' +
    '</div>'
  );
}

/* ================= 畫面渲染 ================= */

function render() {
  var app = document.getElementById("app");
  var html = "";
  if (state.screen === "home") html = renderHome();
  else if (state.screen === "howto") html = renderHowto();
  else if (state.screen === "step1") html = renderStep1();
  else if (state.screen === "step2") html = renderStep2();
  else if (state.screen === "step3") html = renderStep3();
  else if (state.screen === "step4") html = renderStep4();
  else if (state.screen === "step5") html = renderStep5();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  bindEvents();
}

      '<div class="fp-wrap">' + FP_SVG + '<div class="fp-scan"></div></div>' +
      '<div class="home-title"><div class="headline">能力鑑識所</div><div class="sub">ABILITY FORENSICS LAB</div></div>' +

      '<ul class="brief-list">' +
        '<li><span class="bx">[01]</span>約 3～5 分鐘，像偵探一樣回放現場</li>' +
        '<li><span class="bx">[02]</span>12 個現場，挑 2～3 個你親身經歷過的</li>' +

function renderHowto() {
  var items = "";
  HOWTO_STEPS.forEach(function(s, i) {
    items += '<div class="howto-item"><span class="num">' + s.icon + '</span><div><h3>STEP ' + (i+1) + '｜' + s.title + '</h3><p>' + s.desc + '</p></div></div>';
  });

    renderBrandLogo() +
    cardOpen("📖", "鑑識流程說明", "CASE FILE · BRIEFING", "📡") +
      '<p class="body-copy" style="margin-bottom:14px;">整個鑑識大約 3～5 分鐘，五個階段，像偵探一樣回放現場、找線索。</p>' +
      '<div class="howto-list">' + items + '</div>' +
      '<button class="cta" id="btnToStep1"><span>我準備好了</span><span class="arrow">▶</span></button>' +
    CARD_CLOSE
  );
}

function renderStep1() {
  var count = state.selectedEvents.length;
  var max = 3;
  var html = "";
  EVENT_CATS.forEach(function(cat) {
    html += '<div class="event-cat">▎' + cat + '</div><div class="evi-grid">';
    EVENTS.filter(function(e){ return e.cat === cat; }).forEach(function(e, n) {
      var isSel = state.selectedEvents.indexOf(e.id) !== -1;
      var disabled = (!isSel && count >= max) ? " disabled" : "";
      html += '<div class="event-card' + (isSel ? " selected" : "") + disabled + '" data-id="' + e.id + '">' +
                '<span class="tent">' + CAT_LETTER[cat] + (n + 1) + '</span>' +
                '<span class="icon">' + e.icon + '</span>' +
                '<span class="txt">' + e.text + '</span>' +
              '</div>';
    });
    html += '</div>';
  });
  var idkSel = state.selectedEvents.indexOf(IDK_EVENT_ID) !== -1;
  var idkDisabled = (!idkSel && count >= max) ? " disabled" : "";
  html += '<div class="event-cat">▎其他</div><div class="evi-grid"><div class="event-card idk' + (idkSel ? " selected" : "") + idkDisabled + '" data-id="' + IDK_EVENT_ID + '">' +
            '<span class="icon">🤷</span><span class="txt">這些我目前都還沒特別遇過</span>' +
          '</div></div>';

  var realCount = state.selectedEvents.filter(function(id){ return id !== IDK_EVENT_ID; }).length;
  var canProceed = realCount >= 2;

  return (
    renderBrandLogo() +
    cardOpen("🔍", "哪些現場，你曾經在場？", "CASE FILE · NODE 01", "🔍") +
      '<p class="body-copy">點選 2～3 張證物卡，代表你親身經歷過的現場。</p>' +
      '<div class="select-count" style="margin-top:12px;">已採證 <b>' + realCount + ' / 2～3</b></div>' +
      html +
      '<button class="cta" id="btnToStep2" ' + (canProceed ? "" : "disabled") + '><span>開始回放</span><span class="arrow">▶</span></button>' +
    CARD_CLOSE +
    auroraSignature("現場勘查", AURORA_LINES.step1)
  );
}

function currentRealEvents() {
  return state.selectedEvents.filter(function(id){ return id !== IDK_EVENT_ID; });
}

function renderStep2() {
  var realEvents = currentRealEvents();
  var eventId = realEvents[state.step2Index];
  var ev = getEvent(eventId);
  var answer = state.eventAnswers[eventId] || {};

  var actionHtml = "";
  ACTIONS.forEach(function(a, i) {
    var picked = answer.actionId === a.id;
    actionHtml += '<div class="action-btn' + (picked ? " picked" : "") + '" data-id="' + a.id + '"><span class="no">' + pad2(i + 1) + '</span><span>' + a.text + '</span></div>';
  });

  var otherBox = "";
  if (answer.actionId === "other") {
    otherBox = '<input type="text" class="action-other-input" id="otherInput" placeholder="> 打字描述你當時做了什麼…" value="' + (answer.otherText ? answer.otherText.replace(/"/g,'&quot;') : "") + '">';
  }

  var canNext = !!answer.actionId && (answer.actionId !== "other" || (answer.otherText && answer.otherText.trim() !== ""));

  return (
    renderBrandLogo() +
    cardOpen("📼", "回放當時的畫面", "CASE FILE · NODE 02", "📼") +
      '<div class="cctv">' +
        '<div class="cctv-top"><span class="rec">● REC</span><span>CAM ' + pad2(state.step2Index + 1) + ' ▏REPLAY 00:0' + (state.step2Index + 1) + ':24</span></div>' +
        '<div class="cctv-event"><span class="icon">' + ev.icon + '</span><span class="txt">' + ev.text + '</span></div>' +
      '</div>' +
      '<p class="body-copy" style="margin-bottom:10px;">當時你做了什麼？選一條最接近的紀錄（沒有標準答案）。</p>' +
      '<div class="action-list">' + actionHtml + '</div>' +
      otherBox +
      '<div class="followup-label">// 後來呢？發生了什麼改變？（可以不填）</div>' +
      '<textarea class="followup-input" id="followupInput" rows="2" placeholder="簡單打幾個字也可以…">' + (answer.followup || "") + '</textarea>' +
      '<div class="select-count" style="margin-top:10px;">現場 ' + (state.step2Index + 1) + ' / ' + realEvents.length + '</div>' +
      '<button class="cta" id="btnStep2Next" ' + (canNext ? "" : "disabled") + '><span>' +
        (state.step2Index === realEvents.length - 1 ? "前往能力鑑識" : "下一個現場") +
      '</span><span class="arrow">▶</span></button>' +
    CARD_CLOSE +
    auroraSignature("回放筆記", AURORA_LINES.step2)
  );
}

function renderStep3() {
  var realEvents = currentRealEvents();
  var eventId = realEvents[state.step3Index];
  var ev = getEvent(eventId);
  var answer = state.eventAnswers[eventId] || {};
  var action = getAction(answer.actionId);
  var actionText = answer.actionId === "other" ? (answer.otherText || "你描述的做法") : action.text;
  var primaryAbility = getAbility(action.abilities[0]);

  return (
    renderBrandLogo() +
    cardOpen("🕵️", "發現一個行動線索", "CASE FILE · NODE 03", "🕵️") +
      '<div class="forensic-label">CASE ' + pad2(state.step3Index + 1) + ' ・ ' + ev.icon + ' ' + ev.text + '</div>' +
      '<div class="forensic-quote">當時你<b>' + actionText + '</b>。</div>' +
      '<div class="scan-wrap"><div class="scan-label">SCANNING EVIDENCE…</div><div class="scan-bar"><i></i></div></div>' +
      '<div class="reveal-block">' +
        '<div class="found-tag"><span class="icon">' + primaryAbility.icon + '</span><div><div class="small">可能展現的能力</div><div class="ability-name">' + primaryAbility.name + '</div></div></div>' +
        '<div class="forensic-basis"><b>📌 鑑識依據：</b>你不只是經歷了這件事，而是實際做出了「' + actionText + '」這個行動，這可能正是' + primaryAbility.name + '的線索。</div>' +
        '<button class="cta" id="btnForensicNext"><span>' +
          (state.step3Index === realEvents.length - 1 ? "整理能力線索" : "下一個線索") +
        '</span><span class="arrow">▶</span></button>' +
      '</div>' +
    CARD_CLOSE +
    auroraSignature("鑑識筆記", AURORA_LINES.step3)
  );
}

function computeAbilitySignal() {
  var tally = {};
  var evidence = {};
  currentRealEvents().forEach(function(eventId) {
    var ev = getEvent(eventId);
    var answer = state.eventAnswers[eventId] || {};
    var action = getAction(answer.actionId);
    if (!action) return;
    var actionText = answer.actionId === "other" ? (answer.otherText || "你描述的做法") : action.text;
    action.abilities.forEach(function(abId) {
      tally[abId] = (tally[abId] || 0) + 1;
      if (!evidence[abId]) evidence[abId] = [];
      evidence[abId].push({ eventIcon: ev.icon, eventText: ev.text, actionText: actionText });
    });
  });
  return { tally: tally, evidence: evidence };
}

function buildEvidenceLines(abilityId, signal) {
  var list = signal.evidence[abilityId] || [];
  return list.map(function(e) {
    return e.eventIcon + ' 「' + e.eventText + '」裡，你' + e.actionText + '。';
  });
}

function renderStep4() {
  if (state.step4Cards.length === 0) {
    var sig0 = computeAbilitySignal();
    var ranked = Object.keys(sig0.tally).sort(function(a,b){ return sig0.tally[b]-sig0.tally[a]; });
    var showCount = Math.min(4, ranked.length);
    state.step4Cards = ranked.slice(0, showCount).map(function(id){ return { abilityId: id, reaction: null }; });
    state.step4Pool = ranked.slice(showCount);
  }
  var signal = computeAbilitySignal();

  var cardsHtml = "";
  state.step4Cards.forEach(function(card, idx) {
    var ab = getAbility(card.abilityId);
    var count = signal.tally[card.abilityId] || 1;
    var confClass = count >= 2 ? " strong" : "";
    var confText = count >= 2 ? "多次線索佐證" : "初步線索";
    var evHtml = buildEvidenceLines(card.abilityId, signal).map(function(l){ return '<div>' + l + '</div>'; }).join("");

    cardsHtml +=
      '<div class="ability-card" data-idx="' + idx + '">' +
        '<div class="tag-top"><span class="hole"></span><span class="tag-no">EVIDENCE TAG #' + pad2(idx + 1) + '</span><span class="confidence-tag' + confClass + '">' + confText + '</span></div>' +
        '<div class="head"><span class="icon">' + ab.icon + '</span><h4>' + ab.name + '</h4></div>' +
        '<p class="desc">' + ab.desc + '</p>' +
        '<div class="evidence-box">' + evHtml + '</div>' +
        '<div class="reaction-row">' +
          '<button class="reaction-btn' + (card.reaction === "yes" ? " active-yes" : "") + '" data-act="yes" data-idx="' + idx + '">✨ 很符合我</button>' +
          '<button class="reaction-btn' + (card.reaction === "maybe" ? " active-maybe" : "") + '" data-act="maybe" data-idx="' + idx + '">🤔 有一點像</button>' +
          '<button class="reaction-btn" data-act="swap" data-idx="' + idx + '">🔄 換一個</button>' +
        '</div>' +
      '</div>';
  });

  return (
    renderBrandLogo() +
    cardOpen("⭐", "確認你的能力線索", "CASE FILE · NODE 04", "⭐") +
      '<p class="body-copy" style="margin-bottom:14px;">這些是從你的行動裡找到的證物，不一定全部都要接受，你可以自己判斷。</p>' +
      cardsHtml +
      '<button class="cta" id="btnToStep5"><span>收進能力背包</span><span class="arrow">🎒</span></button>' +
    CARD_CLOSE +
    auroraSignature("鑑識小提醒", AURORA_LINES.step4)
  );
}

function buildAuroraBackpackSummary(cards, signal) {
  if (!cards || cards.length === 0) {
    return "目前蒐集到的線索還太少，之後可以再多回放幾個現場，讓線索更清楚一點。";
  }
  var names = cards.map(function(c){ return "「" + getAbility(c.abilityId).name + "」"; }).join("、");
  var multiCount = cards.filter(function(c){ return (signal.tally[c.abilityId]||1) >= 2; }).length;
  var extra = multiCount > 0
    ? "其中有幾項能力，是在不只一個現場裡都出現了類似的行動，這讓這些線索更值得留意。"
    : "這些目前都還是初步線索，之後可以在不同的事件裡繼續觀察，看看它們會不會重複出現。";
  return "Aurora 把你回放的這幾個現場放在一起看，發現你曾經在不同情境裡，展現出" + names + "這些行動線索。" + extra + "原來那些你覺得只是順手做的小事，也可能是值得珍惜的能力證據。";
}

function firstEvidenceShort(abilityId, signal) {
  var list = signal.evidence[abilityId] || [];
  if (list.length === 0) return "";
  var e = list[0];
  var s = e.eventIcon + ' 在「' + e.eventText + '」裡，你' + e.actionText + '。';
  if (list.length > 1) s += '（另有 ' + (list.length - 1) + ' 個現場也有類似線索）';
  return s;
}

function renderStep5() {
  if (!state.finalBackpack) {
    state.finalBackpack = { cards: state.step4Cards.slice() };
  }
  var signal = computeAbilitySignal();
  var cards = state.finalBackpack.cards;
  var totalEvents = currentRealEvents().length;

  var tiles = "";
  cards.forEach(function(c) {
    var ab = getAbility(c.abilityId);
    var flag = c.reaction === "yes" ? "✨ 很符合我" : (c.reaction === "maybe" ? "🤔 有一點像我" : "");
    tiles += '<div class="bp-tile"><span class="ic">' + ab.icon + '</span><h4>' + ab.name + '</h4><p>' + ab.desc + '</p>' +
      '<div class="ev">' + firstEvidenceShort(c.abilityId, signal) + '</div>' +
      (flag ? '<span class="flag">' + flag + '</span>' : '') + '</div>';
  });

  var topAbility = cards.length > 0 ? getAbility(cards[0].abilityId) : null;

  return (
    renderBrandLogo('<button class="pill-btn" id="btnRestart">🔄 重新鑑識</button>') +

    '<div class="declass">' +
      '<div class="stamp">已解封 ・ DECLASSIFIED</div>' +
      '<div class="headline">你的能力檔案</div>' +
      '<p class="subtitle">不是能力上限，只是目前找到的證據。</p>' +
    '</div>' +

    '<div class="dossier">' +
      '<div class="dossier-tab">PERSONAL ABILITY FILE</div>' +
      '<div class="dossier-paper">' +
        '<div class="dp-head"><div class="t">未來羅盤<br>能力鑑識檔案</div><div class="no">FILE NO.<br>FC-ABL / ' + pad2(cards.length) + '</div></div>' +
        '<div class="dp-stat">🔍 回放 ' + totalEvents + ' 個現場 ・ 🕵️ 鑑識出 ' + cards.length + ' 項能力線索</div>' +
        '<div class="bp-grid">' + tiles + '</div>' +
        '<div class="dp-foot"><span>目前的線索，不是能力上限</span><span>✦ FORENSIC LAB</span></div>' +
      '</div>' +
    '</div>' +

    '<div class="aurora-panel">' +
      '<div class="panel-head">' + OWL_SVG.replace('class="owl-avatar"', 'class="owl-avatar" style="width:34px;height:34px;"') + '<span class="label">AURORA ▸ 鑑識總結（系統整理，供參考）</span></div>' +
      '<p>' + buildAuroraBackpackSummary(cards, signal) + '</p>' +
      (topAbility ? '<p class="tip-line">🌱 下一步：' + topAbility.next + '</p>' : '') +
      '<p class="tip-line">這些是目前找到的能力證據，不是你的能力上限。你還有很多技能等著被發現！</p>' +
    '</div>' +

    '<div class="report"><div class="rp-title">✨ 探索完成！</div>' +
      '<div class="rp-step">📸 ① 截圖你的「能力檔案」<small>請確認截圖包含整張卡片，或按下面「下載」取得完整圖片</small></div>' +
      '<div class="rp-step">💬 ② 回到 LINE 聊天室傳送圖片</div>' +
      '<div class="rp-step">🚀 ③ 再輸入【能力回報】</div>' +
      '<div class="rp-chips"><span>⭐ 任務積分 +10</span><span>🌌 探索進度 +2%</span><span>🏅 獲得能力徽章</span></div></div>' +
      '<a class="cta rp-line" href="' + LINE_URL + '">回到 LINE</a>' +
    '<div class="footer-actions">' +
      '<button class="cta" id="btnDownload"><span>下載能力檔案</span><span class="arrow">📥</span></button>' +
    '</div>'
  );
}

/* ================= 事件綁定 ================= */

function bindEvents() {
  var btnStart = document.getElementById("btnStart");
  if (btnStart) btnStart.addEventListener("click", function(){ state.screen="howto"; render(); });

  var btnToStep1 = document.getElementById("btnToStep1");
  if (btnToStep1) btnToStep1.addEventListener("click", function(){ state.screen="step1"; render(); });

  document.querySelectorAll(".event-card:not(.disabled)").forEach(function(el) {
    el.addEventListener("click", function() {
      var id = el.getAttribute("data-id");
      var y = window.scrollY;
      var idx = state.selectedEvents.indexOf(id);
      if (idx === -1) { if (state.selectedEvents.length < 3) state.selectedEvents.push(id); }
      else { state.selectedEvents.splice(idx, 1); }
      render();
      window.scrollTo(0, y);
    });
  });

  var btnToStep2 = document.getElementById("btnToStep2");
  if (btnToStep2) btnToStep2.addEventListener("click", function() {
    state.step2Index = 0;
    state.screen = "step2";
    render();
  });

  document.querySelectorAll(".action-btn").forEach(function(el) {
    el.addEventListener("click", function() {
      var realEvents = currentRealEvents();
      var eventId = realEvents[state.step2Index];
      var actionId = el.getAttribute("data-id");
      var y = window.scrollY;
      if (!state.eventAnswers[eventId]) state.eventAnswers[eventId] = {};
      state.eventAnswers[eventId].actionId = actionId;
      render();
      window.scrollTo(0, y);
    });
  });

  var otherInput = document.getElementById("otherInput");
  if (otherInput) {
    otherInput.addEventListener("input", function() {
      var realEvents = currentRealEvents();
      var eventId = realEvents[state.step2Index];
      state.eventAnswers[eventId].otherText = otherInput.value;
      var btn = document.getElementById("btnStep2Next");
      if (btn) btn.disabled = otherInput.value.trim() === "";
    });
  }

  var followupInput = document.getElementById("followupInput");
  if (followupInput) {
    followupInput.addEventListener("input", function() {
      var realEvents = currentRealEvents();
      var eventId = realEvents[state.step2Index];
      if (!state.eventAnswers[eventId]) state.eventAnswers[eventId] = {};
      state.eventAnswers[eventId].followup = followupInput.value;
    });
  }

  var btnStep2Next = document.getElementById("btnStep2Next");
  if (btnStep2Next) btnStep2Next.addEventListener("click", function() {
    var realEvents = currentRealEvents();
    if (state.step2Index < realEvents.length - 1) {
      state.step2Index++;
      render();
    } else {
      state.step3Index = 0;
      state.screen = "step3";
      render();
    }
  });

  var btnForensicNext = document.getElementById("btnForensicNext");
  if (btnForensicNext) btnForensicNext.addEventListener("click", function() {
    var realEvents = currentRealEvents();
    if (state.step3Index < realEvents.length - 1) {
      state.step3Index++;
      render();
    } else {
      state.screen = "step4";
      render();
    }
  });

  document.querySelectorAll(".reaction-btn").forEach(function(el) {
    el.addEventListener("click", function() {
      var idx = parseInt(el.getAttribute("data-idx"), 10);
      var act = el.getAttribute("data-act");
      var y = window.scrollY;
      if (act === "swap") {
        if (state.step4Pool.length > 0) {
          var nextId = state.step4Pool.shift();
          state.step4Cards[idx] = { abilityId: nextId, reaction: null };
        }
      } else {
        state.step4Cards[idx].reaction = (state.step4Cards[idx].reaction === act) ? null : act;
      }
      render();
      window.scrollTo(0, y);
    });
  });

  var btnToStep5 = document.getElementById("btnToStep5");
  if (btnToStep5) btnToStep5.addEventListener("click", function() {
    state.finalBackpack = null;
    state.screen = "step5";
    render();
  });

  var btnRestart = document.getElementById("btnRestart");
  if (btnRestart) btnRestart.addEventListener("click", resetState);

  var btnDownload = document.getElementById("btnDownload");
  if (btnDownload) btnDownload.addEventListener("click", renderShareCard);
}

/* ================= 分享卡（canvas 繪製，動態高度） ================= */

function wrapCanvasText(ctx, text, maxWidth) {
  var chars = text.split("");
  var lines = [];
  var line = "";
  chars.forEach(function(ch) {
    var test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line !== "") { lines.push(line); line = ch; }
    else { line = test; }
  });
  if (line) lines.push(line);
  return lines;
}

function renderShareCard() {
  var signal = computeAbilitySignal();
  var cards = (state.finalBackpack && state.finalBackpack.cards) || [];
  var blocks = cards.map(function(c, i) {
    var ab = getAbility(c.abilityId);
    var flag = c.reaction === "yes" ? "（我覺得：很符合我）" : (c.reaction === "maybe" ? "（我覺得：有一點像我）" : "");
    return { h: ab.icon + " " + (i + 1) + "．" + ab.name + flag, t: ab.desc + "\n證據：" + firstEvidenceShort(c.abilityId, signal) };
  });
  blocks.push({ h: "🦉 AURORA 的整理（系統自動產生，供參考）", t: buildAuroraBackpackSummary(cards, signal) });
  drawShare({ title: "能力探索結果", subtitle: "能力鑑識所｜我的能力檔案", code: "FC-ABL / PERSONAL ABILITY FILE", blocks: blocks,
    bg0: "#1a1d2b", bg1: "#0b0d13", accent: "#ffd23f", footer: "這些是目前找到的能力證據，不是你的能力上限", imgId: "shareImg", boxId: "shareOverlay", showCls: "show",
    deco: function(x, W) { x.save(); x.beginPath(); x.rect(26, 30, W - 52, 14); x.clip(); for (var sx = 16; sx < W; sx += 28) { x.fillStyle = "#ffd23f"; x.beginPath(); x.moveTo(sx, 44); x.lineTo(sx + 14, 44); x.lineTo(sx + 28, 30); x.lineTo(sx + 14, 30); x.closePath(); x.fill(); } x.restore(); } });
}

// 下載圖片：先量測內容再決定高度；標題固定、文字放大、對比提高，方便手機截圖與 AI 辨識
function drawShare(o) {
  var W = 720, P = 64, F = "'PingFang TC','Microsoft JhengHei',sans-serif", BODY = 17, LH = 28;
  var m = document.createElement("canvas").getContext("2d"); m.font = BODY + "px " + F;
  function wrapLines(text, maxW) {
    var out = [], line = "";
    text.split("").forEach(function(ch) { var t = line + ch; if (m.measureText(t).width > maxW && line !== "") { out.push(line); line = ch; } else line = t; });
    if (line) out.push(line); return out;
  }
  o.blocks.forEach(function(b) { b.lines = []; b.t.split("\n").forEach(function(par) { wrapLines(par, W - P * 2 - (b.indent || 0)).forEach(function(l) { b.lines.push(l); }); }); });
  var H = 250; o.blocks.forEach(function(b) { H += 46 + b.lines.length * LH + 24; }); H = Math.max(H + 100, 820);
  var c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
  var g = x.createRadialGradient(W * .7, 0, 0, W / 2, H * .4, H); g.addColorStop(0, o.bg0); g.addColorStop(1, o.bg1); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(255,255,255,0.35)"; for (var i = 0; i < 60; i++) { x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 1.4 + .3, 0, 7); x.fill(); }
  if (o.deco) o.deco(x, W, H);
  x.strokeStyle = o.accent; x.globalAlpha = .55; x.lineWidth = 2; x.strokeRect(26, 30, W - 52, H - 60); x.globalAlpha = 1;
  x.textAlign = "center";
  x.font = "bold 28px " + F; x.fillStyle = "#ffffff"; x.fillText("未來羅盤｜" + o.title, W / 2, 96);
  x.font = "15px " + F; x.fillStyle = o.accent; x.fillText(o.subtitle, W / 2, 128);
  x.font = "13px monospace"; x.fillStyle = "#c9cde6"; x.fillText(o.code, W / 2, 156);
  x.textAlign = "left";
  var y = 210;
  o.blocks.forEach(function(b) {
    x.strokeStyle = "rgba(255,255,255,0.18)"; x.lineWidth = 1; x.setLineDash([4, 5]); x.beginPath(); x.moveTo(P, y - 22); x.lineTo(W - P, y - 22); x.stroke(); x.setLineDash([]);
    x.font = "bold 20px " + F; x.fillStyle = o.accent; x.fillText(b.h, P, y + 6);
    y += 46;
    x.font = BODY + "px " + F; x.fillStyle = "#eceef8";
    b.lines.forEach(function(l) { x.fillText(l, P + (b.indent || 0), y); y += LH; });
    y += 24;
  });
  x.textAlign = "center"; x.font = "14px " + F; x.fillStyle = "#c9cde6"; x.fillText(o.footer, W / 2, H - 56);
  document.getElementById(o.imgId).src = c.toDataURL("image/png");
  document.getElementById(o.boxId).classList.add(o.showCls);
}

function closeShare() { document.getElementById("shareOverlay").classList.remove("show"); }

/* ================= 啟動 ================= */

render();
</script>
