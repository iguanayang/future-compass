<title>時間探索｜AI 時間管理實驗室</title>
<style>
  :root { --bg:#0f0a1c; --bg2:#26163f; --gold:#b894e8; --gl:#e9d6ff; --cu:#7c52c4; --br:#3b2370; --au:#e3b94a; --text:#f3ecfb; --dim:#c3b4dc; --line:rgba(184,148,232,.34); --soft:rgba(184,148,232,.09); --ok:#8fd694; --bad:#ff8a7a; --mono:"SFMono-Regular","Menlo","Courier New",monospace; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { background:radial-gradient(circle at 70% -10%,var(--bg2) 0%,var(--bg) 60%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; min-height:100%; overflow-x:hidden; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .clockring { position:fixed; pointer-events:none; z-index:0; border-radius:50%; opacity:.55;
    background:repeating-conic-gradient(rgba(184,148,232,.38) 0 .5deg,transparent .5deg 6deg);
    -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 67%,transparent 68%); mask:radial-gradient(circle,transparent 62%,#000 63%,#000 67%,transparent 68%);
    animation:cr 240s linear infinite; }
  .clockring.a { width:560px; height:560px; right:-270px; top:-210px; }
  .clockring.b { width:420px; height:420px; left:-210px; bottom:-170px; animation-direction:reverse; }
  @keyframes cr { to { transform:rotate(360deg); } }
  .glow { position:fixed; left:50%; top:-140px; width:420px; height:420px; margin-left:-210px; border-radius:50%; background:radial-gradient(circle,rgba(184,148,232,.22),transparent 70%); pointer-events:none; z-index:0; }
  #app { position:relative; z-index:1; max-width:clamp(320px,92vw,440px); margin:0 auto; padding:clamp(16px,5vw,22px) clamp(14px,5vw,20px) 44px; min-height:100dvh; }
  @media (min-width:640px){ #app{ max-width:500px; padding-top:36px; } }
  #app.enter { animation:rise .38s cubic-bezier(.15,.8,.25,1) both; }
  @keyframes rise { from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:none; } }

  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }

  .brand .en { font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--gl); display:block; }
  .brand .zh { font-size:15px; font-weight:800; }
  .pill { background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .line { height:1px; background:linear-gradient(90deg,var(--gold),transparent); opacity:.55; margin-bottom:12px; }
  .stage { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--gl); margin-bottom:8px; }
  .habs { display:flex; gap:6px; letter-spacing:0; } .hab { font-size:11px; color:#9484b0; border:1px solid rgba(184,148,232,.25); border-radius:999px; padding:2px 8px; white-space:nowrap; } .hab.on { color:var(--gl); border-color:var(--gold); background:rgba(184,148,232,.15); }
  .habrow { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:8px 0 4px; } .habc { text-align:center; width:30%; min-width:92px; } .habc .c { font-size:30px; filter:grayscale(1) opacity(.4); } .habc.on .c { filter:none; } .habc b { display:block; font-size:12.5px; margin-top:2px; } .habc small { display:block; font-size:11px; color:var(--dim); line-height:1.5; margin-top:2px; }
  .track { display:flex; gap:5px; margin:0 0 16px; }
  .track i { flex:1; height:5px; border-radius:3px; background:rgba(184,148,232,.18); }
  .track i.done { background:rgba(184,148,232,.7); } .track i.now { background:var(--gl); box-shadow:0 0 10px var(--gold); }

  .deck { position:relative; border:1px solid var(--line); border-radius:20px; padding:18px 18px 22px; margin-bottom:16px; background:linear-gradient(170deg,rgba(52,30,92,.78),rgba(20,12,38,.9)); }
  .deck::before,.deck::after { content:""; position:absolute; width:22px; height:22px; border:2px solid var(--gold); opacity:.7; }
  .deck::before { left:-1px; top:-1px; border-right:none; border-bottom:none; border-radius:20px 0 0 0; }
  .deck::after { right:-1px; bottom:-1px; border-left:none; border-top:none; border-radius:0 0 20px 0; }
  h2 { font-size:22px; font-weight:900; line-height:1.35; margin:0 0 8px; }
  .sub { font-size:13.5px; color:var(--dim); line-height:1.75; margin:0 0 12px; }
  .q { font-size:15.5px; font-weight:800; line-height:1.5; margin:12px 0 6px; }
  .hint { font-size:12px; color:var(--dim); margin:0 0 10px; line-height:1.6; }
  .warn { font-size:12px; color:var(--gl); background:rgba(184,148,232,.1); border:1px dashed rgba(184,148,232,.5); border-radius:12px; padding:10px 12px; line-height:1.65; margin:10px 0; }

  .bubs { margin:6px 0 4px; }
  .bub { display:inline-flex; align-items:center; gap:6px; padding:11px 15px; border-radius:999px; border:1.5px solid rgba(184,148,232,.55); background:var(--soft); font-size:14px; margin:0 8px 10px 0; cursor:pointer; line-height:1.3; }
  .bub::before { content:"○"; opacity:.6; font-size:13px; }
  .bub.on { background:linear-gradient(135deg,rgba(233,214,255,.32),rgba(124,82,196,.32)); border-color:var(--gl); box-shadow:0 0 14px rgba(184,148,232,.35); }
  .bub.on::before { content:"✓"; opacity:1; font-weight:800; }
  .txt { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--gold); background:rgba(12,8,24,.78); color:var(--text); font-size:14px; margin:0 0 10px; font-family:inherit; }
  .txt::placeholder { color:#8274a3; }
  textarea.txt { resize:vertical; min-height:70px; line-height:1.6; }

  .cta { display:block; width:100%; text-align:center; text-decoration:none; border:none; border-radius:999px; padding:16px 18px; margin-top:16px; font-size:16px; font-weight:800; cursor:pointer; color:#2a1604; background:linear-gradient(180deg,#f6e3a1,#e3b94a 55%,#b88a2a); box-shadow:0 5px 0 #6b4a10,0 10px 22px rgba(227,185,74,.3); transition:transform .08s,box-shadow .08s; }
  .cta:active { transform:translateY(3px); box-shadow:0 2px 0 #6b4a10; }
  .cta:disabled { opacity:.35; box-shadow:none; }
  .ghost { display:block; width:100%; text-align:center; text-decoration:none; background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:13px 16px; margin-top:10px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .copy { display:inline-block; width:auto; margin:6px 0 0; padding:9px 16px; font-size:13px; background:transparent; border:1.5px solid var(--gold); color:var(--gl); border-radius:999px; cursor:pointer; font-weight:700; }

  .aurora { display:flex; gap:12px; align-items:flex-start; background:rgba(184,148,232,.09); border:1px solid var(--line); border-radius:16px; padding:13px; margin:12px 0; }
  .owl { width:40px; height:40px; flex-shrink:0; }
  .aurora .who { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; font-weight:700; color:var(--gl); display:block; margin-bottom:4px; }
  .aurora p { margin:0 0 8px; font-size:13.5px; line-height:1.75; color:#e8dcf5; } .aurora p:last-child { margin-bottom:0; }

  .lv { display:grid; gap:10px; margin:10px 0; }
  .lvb { text-align:left; border:1.5px solid rgba(184,148,232,.55); background:var(--soft); border-radius:16px; padding:14px; cursor:pointer; color:var(--text); font-family:inherit; }
  .lvb b { font-size:16px; display:block; margin-bottom:3px; } .lvb small { font-size:12.5px; color:var(--dim); line-height:1.6; }
  .lvb:active { transform:scale(.98); }

  .scene { perspective:900px; margin:8px 0 12px; }
  .card3d { position:relative; height:330px; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.2,.8,.2,1); }
  .card3d.flipped { transform:rotateY(180deg); }

  .ai { border:1px solid var(--line); border-radius:16px; padding:6px 12px; background:rgba(0,0,0,.25); margin:8px 0; }
  .ai .t { font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--gl); padding:8px 0 2px; }
  .sent { display:flex; gap:10px; align-items:flex-start; padding:11px 8px; border-top:1px dashed rgba(184,148,232,.25); cursor:pointer; font-size:14px; line-height:1.65; border-radius:8px; }
  .sent .n { font-family:var(--mono); color:var(--gl); font-size:12px; margin-top:2px; flex-shrink:0; }
  .sent .mk { margin-left:auto; flex-shrink:0; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--dim); white-space:nowrap; }
  .sent.on { background:rgba(255,138,122,.14); } .sent.on .mk { border-color:var(--bad); color:var(--bad); }
  .sent.on .mk::before { content:"🚩 "; }
  .sent.ok .mk { border-color:var(--ok); color:var(--ok); } .sent.bad .mk { border-color:var(--bad); color:var(--bad); }
  .sent .why { display:block; font-size:12.5px; color:#eadcff; margin-top:6px; line-height:1.6; }
  .sent .body { flex:1; }

  .prompt { white-space:pre-wrap; background:rgba(0,0,0,.4); border:1px solid var(--gold); border-radius:14px; padding:13px; font-size:13px; line-height:1.75; user-select:text; -webkit-user-select:text; margin:10px 0 4px; color:#f6eeff; }
  .fu { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:rgba(255,255,255,.03); font-size:13.5px; line-height:1.6; }
  .fu .copy { display:block; margin-top:6px; }

  .qrow { margin:10px 0; } .qrow label { display:block; font-size:14px; font-weight:700; margin-bottom:6px; line-height:1.5; }
  .qrow .inp { display:flex; gap:8px; align-items:center; } .qrow .inp .txt { margin:0; } .unit { font-size:13px; color:var(--dim); white-space:nowrap; }
  .res { font-size:13px; line-height:1.65; margin-top:6px; padding:8px 10px; border-radius:10px; }
  .res.ok { background:rgba(143,214,148,.12); color:var(--ok); } .res.bad { background:rgba(255,138,122,.12); color:#ffc0b6; }
  .ck { display:flex; align-items:flex-start; gap:10px; padding:12px; border:1.5px solid rgba(184,148,232,.5); border-radius:12px; margin-bottom:8px; cursor:pointer; font-size:14px; line-height:1.55; background:rgba(255,255,255,.03); }
  .ck .bx { width:19px; height:19px; border:1.5px solid var(--gold); border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px; }
  .ck.on { background:rgba(184,148,232,.18); border-color:var(--gl); } .ck.on .bx { background:var(--gold); color:#2a1604; }
  .demo { background:rgba(143,214,148,.08); border:1px solid rgba(143,214,148,.4); border-radius:14px; padding:10px 14px; margin:10px 0; }
  .demo .t { font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ok); margin-bottom:4px; } .demo p { margin:0 0 6px; font-size:13.5px; line-height:1.7; }

  .got { text-align:center; margin-bottom:10px; } .got b { font-size:18px; } .got small { display:block; color:var(--dim); margin-top:4px; }
  .receipt { background:#f3edfb; color:#241640; border-radius:6px; padding:18px 18px 16px; margin:12px 0 16px; font-family:var(--mono); box-shadow:0 14px 30px rgba(0,0,0,.45); position:relative; }
  .receipt::after { content:""; position:absolute; left:0; right:0; bottom:-8px; height:8px; background:radial-gradient(circle at 6px 0,#f3edfb 5px,transparent 6px) 0 0/12px 8px repeat-x; }
  .receipt h3 { margin:0; text-align:center; font-size:15px; letter-spacing:.18em; } .receipt .sm { text-align:center; font-size:10.5px; opacity:.65; margin:3px 0 10px; }
  .rsec { border-top:1.5px dashed rgba(36,22,64,.4); padding:9px 0 3px; } .rsec h4 { margin:0 0 4px; font-size:11.5px; letter-spacing:.06em; color:#6b3fb0; }
  .rsec p { margin:0 0 4px; font-size:12.5px; line-height:1.7; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
  .rfoot { border-top:1.5px dashed rgba(36,22,64,.4); margin-top:6px; padding-top:8px; text-align:center; font-size:10.5px; opacity:.7; }
  .report { border:1px solid rgba(184,148,232,.5); background:rgba(184,148,232,.07); border-radius:16px; padding:16px; margin:16px 0 6px; }
  .report .rp-title { font-weight:800; font-size:15px; margin-bottom:10px; } .report .rp-step { font-size:14px; line-height:1.7; margin:6px 0; }
  .report .rp-step small { display:block; font-size:11.5px; opacity:.7; margin-left:1.6em; }
  .rp-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; } .rp-chips span { font-size:11.5px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.1); }

  .tbar-wrap { margin:12px 0 4px; } .tcap { font-size:13px; font-weight:700; margin-bottom:6px; }
  .tbar { position:relative; display:flex; height:56px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:rgba(0,0,0,.25); }
  .tbar .seg { display:flex; align-items:center; justify-content:center; text-align:center; font-size:10.5px; line-height:1.3; min-width:0; overflow:hidden; border-right:1px solid rgba(0,0,0,.4); }
  .seg.fix { background:#5b4a8c; color:#f1e8ff; } .seg.plan { background:#b894e8; color:#241640; } .seg.rest { background:#7fb6a8; color:#10261f; } .seg.free { background:rgba(255,255,255,.07); color:var(--dim); }
  .tbar .overz { position:absolute; top:0; bottom:0; right:0; background:repeating-linear-gradient(45deg,rgba(255,138,122,.6) 0 6px,rgba(255,138,122,.25) 6px 12px); }
  .tbar .limit { position:absolute; top:-2px; bottom:-2px; width:3px; background:var(--au); box-shadow:0 0 8px var(--au); }
  .tmsg { font-size:13px; margin-top:6px; line-height:1.6; } .tmsg .over { color:#ffb3a8; } .tleg { font-size:11px; color:var(--dim); margin-top:2px; }
  .modal { position:fixed; inset:0; background:rgba(8,5,16,.86); display:flex; align-items:center; justify-content:center; z-index:300; padding:24px; }
  .mbox { background:#1c1236; border:1px solid var(--gold); border-radius:18px; padding:20px; max-width:320px; width:100%; text-align:center; } .mbox h4 { margin:0 0 8px; font-size:16px; } .mbox p { margin:0 0 10px; font-size:13px; color:var(--dim); line-height:1.7; }
  .share { position:fixed; inset:0; background:rgba(8,5,16,.94); display:none; align-items:center; justify-content:center; z-index:200; padding:24px; flex-direction:column; } .share.show { display:flex; }
  .share img { max-width:320px; width:auto; max-height:76vh; object-fit:contain; border-radius:10px; } .share p { color:var(--dim); font-size:12.5px; margin:14px 0; } .share button { background:rgba(184,148,232,.12); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 26px; font-size:13px; cursor:pointer; }
  @media (prefers-reduced-motion:reduce){ .back .badgeimg,.flipbadge,#app.enter,.card3d{ animation:none!important; transition:none!important; } }
</style>

function r1(n){ return String(Math.round(n*100)/100); }
function timeBar(v){
  var b=v.bar, sum=0; b.parts.forEach(function(p){ sum+=p.h; });
  var scale=Math.max(b.total,sum), free=b.total-sum;
  var segs=b.parts.map(function(p){ return '<div class="seg '+p.t+'" style="width:'+(p.h/scale*100)+'%"><span>'+esc(p.l)+'<br>'+r1(p.h)+'</span></div>'; }).join("");
  if(free>0.0001) segs+='<div class="seg free" style="width:'+(free/scale*100)+'%"><span>剩餘<br>'+r1(free)+'</span></div>';
  var over = sum>b.total+0.0001;
  var extra = over ? '<div class="overz" style="width:'+((sum-b.total)/scale*100)+'%"></div><div class="limit" style="left:calc('+(b.total/scale*100)+'% - 1.5px)"></div>' : '';
  var msg = over ? '<b class="over">⚠ 超出可用時間 '+r1(sum-b.total)+' '+b.unit+'</b>，放不進去' : (free>0.0001 ? '還剩 '+r1(free)+' '+b.unit+' 可以當緩衝' : '剛好排滿，沒有緩衝');
  return '<div class="tbar-wrap"><div class="tcap">⏳ 把 AI 的計畫放進時間軸（可用 '+r1(b.total)+' '+b.unit+'）</div><div class="tbar">'+segs+extra+'</div><div class="tmsg">'+msg+'</div><div class="tleg">紫色：計畫｜深紫：固定行程｜綠：休息</div></div>';
}

  return '<div class="deck"><h2>🧮 AI 查核站</h2><div class="warn" style="margin-top:0">'+v.icon+' <b>'+esc(v.title)+'</b>：'+v.story.map(esc).join("；")+'</div>'+

    '<div class="receipt"><h3>時間決策卡</h3><div class="sm">FUTURE COMPASS ｜ TIME LAB</div>'+secs+'<div class="rfoot">這是練習，不是專業建議</div></div>'+
    '<div class="report"><div class="rp-title">✨ 探索完成！</div><div class="rp-step">📸 ① 截圖你的「時間決策卡」<small>請確認截圖包含整張卡片，或按下面「下載」取得完整圖片</small></div><div class="rp-step">💬 ② 回到 LINE 聊天室傳送圖片</div><div class="rp-step">🚀 ③ 再輸入【時間回報】</div><div class="rp-chips"><span>⭐ 任務積分 +10</span><span>🌌 探索進度 +2%</span><span>🏅 獲得時間探索徽章</span></div></div>'+
    '<a class="cta" href="'+LINE_URL+'">回到 LINE</a>'+
    '<button class="ghost" data-act="download">📥 下載我的時間決策卡</button>'+
    '<button class="ghost" data-act="go" data-v="decide">回頭修改</button>'+
    '<button class="ghost" data-act="askRestart">♻️ 重新開始（抽新的任務）</button>';
}

/* ================= 事件 ================= */
function copyText(text, el){
  function done(){ var o=el.textContent; el.textContent="已複製 ✓"; setTimeout(function(){ el.textContent=o; },1400); }
  function fallback(){ var ta=document.createElement("textarea"); ta.value=text; ta.style.cssText="position:fixed;opacity:0;left:-9999px"; document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ el.textContent="請長按文字複製"; } document.body.removeChild(ta); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); } else fallback();
}
function bindAll(){
  document.querySelectorAll("[data-act]").forEach(function(el){ el.addEventListener("click",function(){ act(el.getAttribute("data-act"),el.getAttribute("data-v"),el); }); });
  function bi(id,fn){ var e=document.getElementById(id); if(e) e.addEventListener("input",function(){ fn(e.value); }); }
  bi("inFollow",function(v){ S.followOther=v; });
  bi("inAiNum",function(v){ S.aiNum=v; });
  bi("inAdjust",function(v){ S.adjust=v; });
  bi("inAdvice",function(v){ S.aiAdvice=v; });
  bi("inAction",function(v){ S.actionText=v; var b=document.querySelector(".cta[data-v=res]"); if(b) b.disabled=!(S.decision!=null && actionTextFinal()); });
  document.querySelectorAll("[data-chk]").forEach(function(e){ e.addEventListener("input",function(){ S.chk[parseInt(e.getAttribute("data-chk"),10)]=e.value; }); });
}
function nextScreen(from, dir){
  var i=ORDER.indexOf(from)+dir, to=ORDER[i];
  if(S.noAI){ if(from==="brief"&&dir>0) return "check"; if(from==="check"&&dir<0) return "brief"; }
  return to;
}
function pickVariant(){
  var pool=VARIANTS.filter(function(v){ return v.level===S.level && v.id!==S.vid; });
  S.vid=pool[Math.floor(Math.random()*pool.length)].id;
}
function resetRound(){ S.picks=[]; S.revealed=false; S.noAI=false; S.goal=0; S.cons=[0]; S.fmt=0; S.follows=[]; S.followOther=""; S.chk=["","",""]; S.aiNum=""; S.chkDone=false; S.ck=[false,false,false]; S.adjust=""; S.aiAdvice=""; S.decision=null; S.action=null; S.actionText=""; }
function act(a,v,el){
  var keep=true, anim=false;
  if(a==="level"){ S.level=v; S.vid=null; S.flipped=false; resetRound(); S.screen="draw"; keep=false; anim=true; }
  else if(a==="draw"){ pickVariant(); S.flipped=false; resetRound(); keep=false; }
  else if(a==="redraw"){ pickVariant(); S.flipped=false; resetRound(); keep=false; }
  else if(a==="go"){ S.screen=v; keep=false; anim=true; }
  else if(a==="back"){ S.screen=nextScreen(S.screen,-1); keep=false; anim=true; }
  else if(a==="pick"){ tog(S.picks,parseInt(v,10)); }
  else if(a==="reveal"){ S.revealed=true; }
  else if(a==="goal"){ S.goal=parseInt(v,10); }
  else if(a==="con"){ tog(S.cons,parseInt(v,10)); }
  else if(a==="fmt"){ S.fmt=parseInt(v,10); }
  else if(a==="copy"){ copyText(v==="prompt"?buildPrompt():FOLLOWS[parseInt(v.slice(2),10)], el); return; }
  else if(a==="noai"){ S.noAI=true; S.screen="check"; keep=false; anim=true; }
  else if(a==="follow"){ tog(S.follows,parseInt(v,10)); }
  else if(a==="docheck"){ S.chkDone=true; }
  else if(a==="ck"){ var i=parseInt(v,10); S.ck[i]=!S.ck[i]; }
  else if(a==="dec"){ S.decision=parseInt(v,10); }
  else if(a==="act"){ S.action = (v==="custom") ? "custom" : parseInt(v,10); }
  else if(a==="download"){ share(); return; }
  else if(a==="askRestart"){ S.confirm=true; }
  else if(a==="cancelRestart"){ S.confirm=false; }
  else if(a==="doRestart"){ S=fresh(); keep=false; anim=true; }
  render(keep,anim);
}

/* ================= 下載圖片 ================= */
function share(){
  var W=720,P=64,F="'PingFang TC','Microsoft JhengHei',sans-serif",BODY=17,LH=28;
  var m=document.createElement("canvas").getContext("2d"); m.font=BODY+"px "+F;
  function wl(text,maxW){ var out=[],line=""; text.split("").forEach(function(ch){ var t=line+ch; if(m.measureText(t).width>maxW&&line!==""){out.push(line);line=ch;}else line=t; }); if(line) out.push(line); return out; }
  var blocks=recSections();
  blocks.forEach(function(b){ b.lines=[]; b.t.split("\n").forEach(function(par){ wl(par,W-P*2).forEach(function(l){ b.lines.push(l); }); }); });
  var H=330; blocks.forEach(function(b){ H+=46+b.lines.length*LH+24; }); H=Math.max(H+100,860);
  var img=new Image();
  img.onload=function(){
    var c=document.createElement("canvas"); c.width=W; c.height=H; var x=c.getContext("2d");
    var g=x.createRadialGradient(W*.7,0,0,W/2,H*.4,H); g.addColorStop(0,"#26163f"); g.addColorStop(1,"#0f0a1c"); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.strokeStyle="rgba(184,148,232,.6)"; x.lineWidth=2; x.strokeRect(26,30,W-52,H-60);
    x.save(); x.beginPath(); x.arc(W/2,128,56,0,7); x.clip(); x.drawImage(img,W/2-56,72,112,112); x.restore();
    x.strokeStyle="#e3b94a"; x.lineWidth=3; x.beginPath(); x.arc(W/2,128,57,0,7); x.stroke();
    x.textAlign="center"; x.font="bold 28px "+F; x.fillStyle="#ffffff"; x.fillText("未來羅盤｜時間探索結果",W/2,236);
    x.font="15px "+F; x.fillStyle="#e9d6ff"; x.fillText("AI 時間管理實驗室｜我的時間決策卡",W/2,266); x.font="13px monospace"; x.fillStyle="#cdbfe3"; x.fillText("FC-TIME / RESULT",W/2,292);
    x.textAlign="left"; var y=340;
    blocks.forEach(function(b){ x.strokeStyle="rgba(255,255,255,.18)"; x.lineWidth=1; x.setLineDash([4,5]); x.beginPath(); x.moveTo(P,y-22); x.lineTo(W-P,y-22); x.stroke(); x.setLineDash([]);
      x.font="bold 20px "+F; x.fillStyle="#e9d6ff"; x.fillText(b.h,P,y+6); y+=46; x.font=BODY+"px "+F; x.fillStyle="#f3ecfb"; b.lines.forEach(function(l){ x.fillText(l,P,y); y+=LH; }); y+=24; });
    x.textAlign="center"; x.font="14px "+F; x.fillStyle="#cdbfe3"; x.fillText("這是練習，不是專業建議",W/2,H-56);
    document.getElementById("shareImg").src=c.toDataURL("image/png"); document.getElementById("shareBox").classList.add("show");
  };
  img.src=BADGE;
}

render(false,false);
</script>
