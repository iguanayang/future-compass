<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #0a0e27;
      --panel: #14183a;
      --border: #2a2f5c;
      --self-color: #4ade80;
      --career-color: #818cf8;
      --life-color: #38bdf8;
      --gold: #ffde59;
      --text: #ffffff;
      --text-dim: #9797c2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at 50% 0%, #1a1f4a 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      padding: 28px 20px 14px;
    }

    .header .icon { font-size: 36px; display: block; margin-bottom: 4px; }
    .header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .header .agent-name { margin-top: 4px; font-size: 13px; color: var(--career-color); }
    .header .overall { margin-top: 6px; font-size: 12px; color: var(--text-dim); }

    .canvas-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 12px;
    }

    .star-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .star-dot { cursor: pointer; transition: r 0.2s ease; }
    .star-dot:active { r: 12; }

    .zone-label {
      font-size: 10px;
      fill: var(--text-dim);
      font-weight: 600;
    }

    .section {
      max-width: 480px;
      margin: 18px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .recent-banner {
      background: linear-gradient(90deg, rgba(129,140,248,0.15), rgba(56,189,248,0.1));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
    }

    .recent-banner .label { font-size: 11px; color: var(--gold); margin: 0 0 3px; }
    .recent-banner .value { font-size: 14px; font-weight: 700; margin: 0; }

    .trajectory-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .traj-svg { width: 100%; height: auto; display: block; }
    .traj-star { cursor: pointer; }

    .progress-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .progress-row .name { font-size: 13px; font-weight: 600; }
    .progress-row .count { font-size: 12px; color: var(--text-dim); }

    .system-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: none;
    }

    .system-list.open { display: flex; flex-direction: column; gap: 5px; }

    .system-row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
    }

    .system-row .stars { color: var(--text-dim); }

    /* 詳情彈窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,7,20,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .modal-overlay.show { display: flex; }

    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 22px 22px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(129, 140, 248, 0.15), 0 0 0 1px rgba(255,255,255,0.02) inset;
      position: relative;
    }

    .modal-card .star-icon {
      font-size: 30px;
      display: block;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 10px rgba(255, 222, 89, 0.5));
      animation: twinkle 2.4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(0.92); }
    }

    .modal-eyebrow {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .modal-card h3 { margin: 0 0 4px; font-size: 17px; }

    .modal-date {
      font-size: 10.5px;
      color: var(--text-dim);
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .modal-divider {
      height: 1px;
      margin: 14px 0;
      background: linear-gradient(90deg, transparent, var(--career-color), transparent);
      opacity: 0.35;
    }

    .takeaway-block { padding: 2px 0; }

    .takeaway-label {
      font-size: 12px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .takeaway-text {
      font-size: 15px;
      line-height: 1.75;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      text-shadow: 0 0 16px rgba(255, 222, 89, 0.25);
    }

    .takeaway-empty {
      font-size: 12.5px;
      color: var(--text-dim);
      font-style: italic;
      margin: 0;
      opacity: 0.8;
    }

    .aurora-block { padding: 2px 0; }

    .aurora-label {
      font-size: 11px;
      color: var(--life-color);
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .aurora-text {
      font-size: 12.5px;
      line-height: 1.7;
      color: #b8bee0;
      margin: 0;
    }

    .modal-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
    }

    .modal-footer-row .badge-note { text-align: left; }
    .modal-footer-row .star-number { color: var(--gold); opacity: 0.85; }

    .points-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--gold);
      font-weight: 600;
    }

    .modal-card button {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .state-box { max-width: 480px; margin: 60px auto; padding: 0 32px; text-align: center; }
    .state-box .emoji { font-size: 40px; display: block; margin-bottom: 14px; }
    .state-box p { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin: 0; }

    .bind-box { max-width: 360px; margin: 50px auto; padding: 0 24px; text-align: center; }
    .bind-box .emoji { font-size: 44px; display: block; margin-bottom: 16px; }
    .bind-box h2 { font-size: 17px; margin: 0 0 8px; }
    .bind-box p { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
    .bind-box input {
      width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 15px; text-align: center;
      margin-bottom: 12px; letter-spacing: 1px;
    }
    .bind-box input:focus { outline: none; border-color: var(--career-color); }
    .bind-box button {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(90deg, var(--career-color), var(--life-color));
      color: #0a0e27; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .bind-box button:disabled { opacity: 0.5; }
    .bind-error { color: #ff6b6b; font-size: 12px; margin-top: 10px; min-height: 16px; }

    .skeleton {
      max-width: 480px; margin: 40px auto; height: 280px; border-radius: 16px;
      background: linear-gradient(90deg, var(--panel) 25%, #1e2350 37%, var(--panel) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="icon">🌌</span>
    <h1>我的星圖</h1>
    <div class="agent-name" id="agentName"></div>
    <div class="overall" id="overallText"></div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="skeleton"></div>
  </div>

  <div id="sections"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script>
    var currentUserId = null;
    var starData = null;

    // ⚠️ 請填入你的 Apps Script 部署網址（.../exec 結尾）
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbwEKM9ToJygUGGo5lMEX_-zK6QOsblhBSUN0HaHFLJF_C6eKcvQBqMKpP4DCUlygyA_Bw/exec";

    var SYSTEM_COLOR = {
      "餐飲服務": "#ff9d5c",
      "媒體創意": "#c77dff",
      "商業管理": "#5c9dff",
      "健康保健": "#5cff9d",
      "資訊科技": "#5cf0ff",
      "教育公益": "#ffde59"
    };

    window.onerror = function(msg, url, line) {
      document.getElementById("canvasWrap").innerHTML =
        '<div class="state-box"><span class="emoji">❌</span><p style="text-align:left;word-break:break-all;">JS 錯誤：' + msg + '（第 ' + line + ' 行）</p></div>';
      return true;
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.getElementById("canvasWrap").innerHTML =
        '<div class="state-box"><span class="emoji">❌</span><p style="text-align:left;word-break:break-all;">未攔截的 Promise 錯誤：' +
        (event.reason && event.reason.message ? event.reason.message : JSON.stringify(event.reason)) +
        '</p></div>';
    });

    function showDebugStatus(text) {
      var wrap = document.getElementById("canvasWrap");
      var note = document.createElement("div");
      note.style.cssText = "text-align:center;font-size:11px;color:var(--text-dim);padding:6px 0;";
      note.textContent = text;
      wrap.appendChild(note);
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    var jsonpCounter = 0;
    function jsonpRequest(url) {
      return new Promise(function(resolve, reject) {
        var callbackName = "jsonpCallback_" + (jsonpCounter++) + "_" + Date.now();
        var script = document.createElement("script");
        var timeoutId = setTimeout(function() { cleanup(); reject(new Error("請求逾時，請檢查網路連線")); }, 10000);
        function cleanup() { clearTimeout(timeoutId); delete window[callbackName]; if (script.parentNode) script.parentNode.removeChild(script); }
        window[callbackName] = function(data) { cleanup(); resolve(data); };
        script.onerror = function() { cleanup(); reject(new Error("無法連線到伺服器")); };
        script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + callbackName;
        document.head.appendChild(script);
      });
    }

    function renderState(emoji, message) {
      document.getElementById("canvasWrap").innerHTML =
        '<div class="state-box"><span class="emoji">' + emoji + '</span><p>' + escapeHtml(message) + '</p></div>';
      document.getElementById("sections").innerHTML = "";
    }

    function renderBindForm(errorMsg) {
      document.getElementById("canvasWrap").innerHTML =
        '<div class="bind-box">' +
          '<span class="emoji">🔑</span>' +
          '<h2>第一次使用，請先綁定身份</h2>' +
          '<p>輸入你的探員專屬代碼完成綁定，之後開啟徽章、稱號或星圖頁面都會自動辨識，不需要再輸入</p>' +
          '<input type="text" id="bindCodeInput" placeholder="請輸入代碼" autocapitalize="off" autocorrect="off">' +
          '<button id="bindSubmitBtn">完成綁定</button>' +
          '<div class="bind-error" id="bindErrorMsg">' + (errorMsg ? escapeHtml(errorMsg) : '') + '</div>' +
        '</div>';
      document.getElementById("sections").innerHTML = "";
      document.getElementById("bindSubmitBtn").addEventListener("click", submitBind);
      document.getElementById("bindCodeInput").addEventListener("keydown", function(e) { if (e.key === "Enter") submitBind(); });
    }

    function submitBind() {
      var input = document.getElementById("bindCodeInput");
      var btn = document.getElementById("bindSubmitBtn");
      var errBox = document.getElementById("bindErrorMsg");
      var code = input.value.trim();
      if (!code) { errBox.textContent = "請輸入代碼"; return; }
      btn.disabled = true; btn.textContent = "綁定中..."; errBox.textContent = "";
      var url = GAS_API_URL + "?action=bindAgent&userId=" + encodeURIComponent(currentUserId) + "&code=" + encodeURIComponent(code);
      jsonpRequest(url).then(function(result) {
        if (result && result.success) { loadStarMap(); }
        else { btn.disabled = false; btn.textContent = "完成綁定"; errBox.textContent = (result && result.error) || "綁定失敗，請再試一次"; }
      }).catch(function() {
        btn.disabled = false; btn.textContent = "完成綁定"; errBox.textContent = "系統錯誤，請稍後再試";
      });
    }

    // ---- 星圖佈局計算 ----
    function buildLayout(stars) {
      var positions = {}; // starId -> {x, y, color}
      var VW = 400;

      // 自我星座：終點星置中，其餘外圍星環繞
      var selfStars = stars.filter(function(s) { return s.constellation === "自我"; });
      var terminal = selfStars.filter(function(s) { return s.isTerminal; })[0];
      var outer = selfStars.filter(function(s) { return !s.isTerminal; });
      var selfCenterX = VW / 2, selfCenterY = 90, selfR = 55;
      outer.forEach(function(s, i) {
        var angle = (Math.PI * 2 / outer.length) * i - Math.PI / 2;
        positions[s.id] = {
          x: selfCenterX + Math.cos(angle) * selfR,
          y: selfCenterY + Math.sin(angle) * selfR * 0.75,
          color: "var(--self-color)"
        };
      });
      if (terminal) {
        positions[terminal.id] = { x: selfCenterX, y: selfCenterY, color: "var(--gold)" };
      }

      // 職業星座：6個星系各自聚落，排成 2 排 x 3 欄
      var careerStars = stars.filter(function(s) { return s.constellation === "職業"; });
      var systems = [];
      careerStars.forEach(function(s) { if (s.system && systems.indexOf(s.system) === -1) systems.push(s.system); });
      var careerTop = 280;
      var cols = 3, rowGap = 120, colGap = 115;
      systems.forEach(function(sys, si) {
        var col = si % cols, row = Math.floor(si / cols);
        var cx = 95 + col * colGap;
        var cy = careerTop + row * rowGap;
        var starsInSys = careerStars.filter(function(s) { return s.system === sys; });
        starsInSys.forEach(function(s, i) {
          var angle = (Math.PI * 2 / starsInSys.length) * i - Math.PI / 2;
          positions[s.id] = {
            x: cx + Math.cos(angle) * 22,
            y: cy + Math.sin(angle) * 18,
            color: SYSTEM_COLOR[sys] || "var(--career-color)"
          };
        });
      });

      // 生活星座：小群聚在底部
      var lifeStars = stars.filter(function(s) { return s.constellation === "生活"; });
      var lifeCenterX = VW / 2, lifeCenterY = careerTop + 2 * rowGap + 55;
      lifeStars.forEach(function(s, i) {
        var angle = (Math.PI * 2 / lifeStars.length) * i - Math.PI / 2;
        positions[s.id] = {
          x: lifeCenterX + Math.cos(angle) * 32,
          y: lifeCenterY + Math.sin(angle) * 28,
          color: "var(--life-color)"
        };
      });

      var totalHeight = lifeCenterY + 70;
      return {
        positions: positions, height: totalHeight,
        selfCenter: {x: selfCenterX, y: selfCenterY}, outer: outer, terminal: terminal,
        selfLabelY: selfCenterY - selfR - 30,
        careerLabelY: careerTop - 60,
        lifeLabelY: lifeCenterY - 55
      };
    }

    // 畫一顆星星圖案：已解鎖＝圓心+十字光芒放射；未解鎖＝樸素暗淡小點
    function starGlyph(cx, cy, r, color, unlocked, big) {
      if (!unlocked) {
        return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.8) + '" fill="#3a3f6e" opacity="0.5"/>';
      }
      var rayLen = r * (big ? 3.2 : 2.6);
      var svg = '';
      var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      dirs.forEach(function(d) {
        var x2 = cx + d[0] * rayLen, y2 = cy + d[1] * rayLen;
        svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="1" stroke-linecap="round" opacity="0.65"/>';
      });
      if (big) {
        var diag = [[0.7, -0.7], [0.7, 0.7], [-0.7, -0.7], [-0.7, 0.7]];
        diag.forEach(function(d) {
          var x2 = cx + d[0] * rayLen * 0.6, y2 = cy + d[1] * rayLen * 0.6;
          svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>';
        });
      }
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '"/>';
      return svg;
    }

    function renderStarMap(result) {
      if (!result) { renderState("⚠️", "查詢失敗，請稍後再試"); return; }
      if (result.needBind) { renderBindForm(); return; }
      if (!result.success) { renderState("🔒", result.error || "查詢失敗，請稍後再試"); return; }

      starData = result;
      if (result.agentName) document.getElementById("agentName").textContent = "探員：" + result.agentName;
      document.getElementById("overallText").textContent = "已點亮 " + result.unlockedCount + " / " + result.totalCount + " 顆星";

      var stars = result.stars || [];
      var layout = buildLayout(stars);

      // ---- 畫布 SVG ----
      var svg = '<svg class="star-svg" viewBox="0 0 400 ' + layout.height + '" xmlns="http://www.w3.org/2000/svg">';

      svg += '<text x="20" y="' + layout.selfLabelY + '" class="zone-label">🧭 自我星座</text>';
      svg += '<text x="20" y="' + layout.careerLabelY + '" class="zone-label">🌎 職業星座</text>';
      svg += '<text x="20" y="' + layout.lifeLabelY + '" class="zone-label">🤖 生活星座</text>';

      // 自我星座連線（外圍指向終點星）
      if (layout.terminal) {
        layout.outer.forEach(function(s) {
          var p1 = layout.positions[s.id], p2 = layout.positions[layout.terminal.id];
          var op = (s.isUnlocked && layout.terminal.isUnlocked) ? "0.6" : "0.25";
          svg += '<line x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y + '" stroke="var(--self-color)" stroke-width="1" stroke-dasharray="2 3" opacity="' + op + '"/>';
        });
      }

      // 星星本體：已解鎖用十字光芒放射效果，未解鎖維持樸素小點
      stars.forEach(function(s) {
        var pos = layout.positions[s.id];
        if (!pos) return;
        var isTerm = s.isTerminal;
        var r = isTerm ? 5 : 3.5;
        var glyph = starGlyph(pos.x, pos.y, r, pos.color, s.isUnlocked, isTerm);
        svg += '<g class="star-dot" data-id="' + s.id + '"' +
          (isTerm && !s.isUnlocked ? ' style="filter:blur(0.6px)"' : '') + '>' + glyph + '</g>';
      });

      svg += '</svg>';
      document.getElementById("canvasWrap").innerHTML = svg;

      document.querySelectorAll(".star-dot").forEach(function(el) {
        el.addEventListener("click", function() {
          var star = stars.find(function(s) { return s.id === el.getAttribute("data-id"); });
          if (star) showStarModal(star);
        });
      });

      renderSections(stars, result);

      document.querySelectorAll(".traj-star").forEach(function(el) {
        el.addEventListener("click", function() {
          var star = stars.find(function(s) { return s.id === el.getAttribute("data-id"); });
          if (star) showStarModal(star);
        });
      });
    }

    function showStarModal(star) {
      var html = '<span class="star-icon">' + (star.isUnlocked ? "✨" : "🔒") + '</span>';
      html += '<div class="modal-eyebrow">星球檔案</div>';
      html += '<h3>' + escapeHtml(star.name) + '</h3>';

      if (star.isUnlocked) {
        if (star.completedDate) html += '<div class="modal-date">' + escapeHtml(star.completedDate) + '</div>';
        html += '<div class="modal-divider"></div>';

        html += '<div class="takeaway-block">';
        html += '<div class="takeaway-label">💡 我的收穫</div>';
        if (star.myTakeaway) {
          html += '<p class="takeaway-text">「' + escapeHtml(star.myTakeaway) + '」</p>';
        } else {
          html += '<p class="takeaway-empty">這段旅程的收穫，等你來寫下</p>';
        }
        html += '</div>';

        if (star.auroraMessage) {
          html += '<div class="modal-divider"></div>';
          html += '<div class="aurora-block">';
          html += '<div class="aurora-label">📡 Aurora 留言</div>';
          html += '<p class="aurora-text">' + escapeHtml(star.auroraMessage).replace(/\n/g, "<br>") + '</p>';
          html += '</div>';
        }

        html += '<div class="modal-divider"></div>';

        html += '<div class="modal-footer-row">';
        if (star.badgeId) html += '<span class="badge-note">🏅 ' + escapeHtml(star.name) + '徽章</span>';
        html += '<span class="star-number">⭐ ' + escapeHtml(star.number) + '</span>';
        html += '</div>';
        html += '<div class="points-note">✨ 探索積分 +' + star.points + '</div>';
      } else {
        html += '<div class="modal-divider"></div>';
        html += '<p class="takeaway-empty" style="margin-top:10px;">尚未點亮這顆星，繼續探索解鎖它吧！</p>';
      }

      html += '<button onclick="closeModal()">關閉</button>';
      document.getElementById("modalCard").innerHTML = html;
      document.getElementById("modalOverlay").classList.add("show");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("show");
    }
    document.getElementById("modalOverlay").addEventListener("click", function(e) {
      if (e.target === this) closeModal();
    });

    function buildTrajectorySVG(stars) {
      var cols = 8, spacingX = 42, spacingY = 40, padding = 20;
      var rows = Math.ceil(stars.length / cols);
      var w = padding * 2 + (cols - 1) * spacingX;
      var h = padding * 2 + (rows - 1) * spacingY;

      var pts = stars.map(function(s, i) {
        var row = Math.floor(i / cols);
        var colInRow = i % cols;
        var col = (row % 2 === 0) ? colInRow : (cols - 1 - colInRow); // 蛇形：偶數排左到右，奇數排右到左
        return { x: padding + col * spacingX, y: padding + row * spacingY, star: s };
      });

      var svg = '<svg class="traj-svg" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

      // 連線（依序連接，已點亮段落較亮）
      for (var i = 0; i < pts.length - 1; i++) {
        var a = pts[i], b = pts[i + 1];
        var bothUnlocked = a.star.isUnlocked && b.star.isUnlocked;
        svg += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y +
          '" stroke="' + (bothUnlocked ? "var(--gold)" : "var(--border)") + '" stroke-width="1" opacity="' + (bothUnlocked ? "0.7" : "0.4") + '"/>';
      }

      pts.forEach(function(p) {
        var s = p.star;
        var glyph = starGlyph(p.x, p.y, 2.2, "var(--gold)", s.isUnlocked, false);
        svg += '<g class="traj-star" data-id="' + s.id + '">' + glyph + '</g>';
      });

      svg += '</svg>';
      return svg;
    }

    function starRatingText(unlocked, total) {
      var filled = total > 0 ? Math.round((unlocked / total) * 5) : 0;
      var str = "";
      for (var i = 0; i < 5; i++) str += (i < filled ? "★" : "☆");
      return str;
    }

    function renderSections(stars, result) {
      var selfStars = stars.filter(function(s) { return s.constellation === "自我"; });
      var careerStars = stars.filter(function(s) { return s.constellation === "職業"; });
      var lifeStars = stars.filter(function(s) { return s.constellation === "生活"; });

      var selfUnlocked = selfStars.filter(function(s){return s.isUnlocked;}).length;
      var careerUnlocked = careerStars.filter(function(s){return s.isUnlocked;}).length;
      var lifeUnlocked = lifeStars.filter(function(s){return s.isUnlocked;}).length;

      var systems = [];
      careerStars.forEach(function(s) { if (s.system && systems.indexOf(s.system) === -1) systems.push(s.system); });

      var html = "";

      // 最近點亮：取已解鎖清單中最後一個（假設 sheet 記錄順序即為解鎖順序）
      var unlockedStars = stars.filter(function(s) { return s.isUnlocked; });
      if (unlockedStars.length > 0) {
        var recent = unlockedStars[unlockedStars.length - 1];
        html += '<div class="section"><div class="recent-banner">' +
          '<p class="label">✨ 最近點亮</p>' +
          '<p class="value">' + escapeHtml(recent.name) + '</p>' +
        '</div></div>';
      }

      // 成長軌跡：全部星星以蜿蜒排列的星軌呈現（自動換行，不受寬度限制），已點亮亮、未點亮暗
      if (stars.length > 0) {
        html += '<div class="section"><div class="section-title">成長軌跡（' + result.unlockedCount + ' / ' + result.totalCount + '）</div>' +
          '<div class="trajectory-wrap">' + buildTrajectorySVG(stars) + '</div></div>';
      }

      // 完成度
      html += '<div class="section"><div class="section-title">完成度</div>';

      html += '<div class="progress-card"><div class="progress-row">' +
        '<span class="name">🧭 自我星座</span>' +
        '<span class="count">' + starRatingText(selfUnlocked, selfStars.length) + ' (' + selfUnlocked + '/' + selfStars.length + ')</span>' +
      '</div></div>';

      html += '<div class="progress-card"><div class="progress-row" onclick="toggleSystemList()">' +
        '<span class="name">🌎 職業星座</span>' +
        '<span class="count">' + careerUnlocked + ' / ' + careerStars.length + ' ▾</span>' +
      '</div><div class="system-list" id="systemList">';
      systems.forEach(function(sys) {
        var sysStars = careerStars.filter(function(s) { return s.system === sys; });
        var sysUnlocked = sysStars.filter(function(s) { return s.isUnlocked; }).length;
        html += '<div class="system-row"><span style="color:' + (SYSTEM_COLOR[sys] || "#fff") + '">' + escapeHtml(sys) + '</span>' +
          '<span class="stars">' + starRatingText(sysUnlocked, sysStars.length) + '</span></div>';
      });
      html += '</div></div>';

      html += '<div class="progress-card"><div class="progress-row">' +
        '<span class="name">🤖 生活星座</span>' +
        '<span class="count">' + starRatingText(lifeUnlocked, lifeStars.length) + ' (' + lifeUnlocked + '/' + lifeStars.length + ')</span>' +
      '</div></div>';

      html += '</div>';

      document.getElementById("sections").innerHTML = html;
    }

    function toggleSystemList() {
      document.getElementById("systemList").classList.toggle("open");
    }

    function loadStarMap() {
      var url = GAS_API_URL + "?action=getStarMapData&userId=" + encodeURIComponent(currentUserId);
      jsonpRequest(url).then(renderStarMap).catch(function(err) {
        renderState("⚠️", "系統發生錯誤：" + (err && err.message ? err.message : "請稍後再試"));
      });
    }

    async function main() {
      showDebugStatus("① 頁面 JS 已啟動...");

      if (typeof liff === "undefined") { renderState("❌", "LIFF SDK 沒有載入成功，請檢查網路連線"); return; }
      showDebugStatus("② LIFF SDK 已載入...");

      try {
        var initPromise = liff.init({ liffId: "2010589127-krFASVpK" });
        var timeoutPromise = new Promise(function(_, reject) { setTimeout(function() { reject(new Error("TIMEOUT_INIT")); }, 8000); });
        await Promise.race([initPromise, timeoutPromise]);
        showDebugStatus("③ liff.init 完成...");

        if (!liff.isLoggedIn()) { showDebugStatus("④ 導向登入..."); liff.login(); return; }
        showDebugStatus("④ 已登入，取得個人資料...");

        var profile = await liff.getProfile();
        currentUserId = profile.userId;
        showDebugStatus("⑤ 已取得 userId，呼叫後端...");

        loadStarMap();
      } catch (err) {
        if (err && err.message === "TIMEOUT_INIT") {
          renderState("⏱️", "liff.init() 逾時，請檢查 LIFF App 的 Endpoint URL 設定。");
        } else {
          renderState("⚠️", "LIFF 初始化失敗：" + (err && err.message ? err.message : JSON.stringify(err)));
        }
      }
    }

    main();
  </script>

</body>
</html>
